<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>書單</title>
<style>
:root{--bg:#eceee9;--cd:#fafaf7;--ink:#1f2a30;--mu:#6b7780;--ln:#d5d9d3;--ac:#1f6f6b;--ac2:#e9f2f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--ln)}
h1{margin:0 0 8px;font:700 22px/1.2 "Noto Serif TC","Songti TC",serif;letter-spacing:.08em}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
input,select,button,textarea{font:inherit;color:inherit;border:1px solid var(--ln);background:var(--cd);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
#q{flex:1;min-width:160px}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:6px 12px;white-space:nowrap}
.tabs button.on{border-color:var(--ac);color:var(--ac);font-weight:700}
.tabs small{color:var(--mu);margin-left:4px}
#stat{color:var(--mu);font-size:13px;margin:0 auto 0 0}
main{max-width:980px;margin:0 auto;padding:12px 16px 80px}
.row{display:grid;grid-template-columns:1fr auto auto auto auto auto;gap:10px;align-items:center;background:var(--cd);border:1px solid var(--ln);border-left:4px solid var(--ln);border-radius:6px;padding:8px 10px;margin-bottom:6px}
.row.完讀{border-left-color:var(--ac)}.row.閱讀中{border-left-color:#d9a21b}.row.棄讀{border-left-color:#b5524a}.row.待購{border-left-style:dashed;border-left-color:var(--mu)}
.in{margin-left:22px}
.v{background:var(--ac2);color:var(--ac);border-radius:4px;padding:0 6px;font-size:13px}
.s,.d{color:var(--mu);font-size:13px}
.tag{display:inline-block;border:1px solid var(--ln);border-radius:10px;padding:0 8px;font-size:12px;margin-right:4px;color:var(--mu)}
.p{min-width:50px;text-align:right}
.gh{display:flex;gap:10px;align-items:center;background:var(--ac2);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;margin:10px 0 6px;cursor:pointer}
.gh b{font-size:16px}.gh .s{margin-right:auto}
.row select{padding:2px 6px}
dialog{border:1px solid var(--ln);border-radius:10px;background:var(--cd);width:min(560px,94vw);padding:16px}
dialog::backdrop{background:#0006}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg label{display:flex;flex-direction:column;font-size:13px;color:var(--mu)}
.fg label input,.fg label select{color:var(--ink)}
.fg .w{grid-column:1/-1}
textarea{width:100%;height:200px}
.empty{text-align:center;color:var(--mu);padding:60px 0}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
@media(max-width:640px){.row{grid-template-columns:1fr auto}.row .t,.row .d{grid-column:1/-1}.fg{grid-template-columns:1fr}}
</style></head><body>
<header>
<h1>書單 <small style="font:12px sans-serif;color:var(--mu)">v4・空白版</small></h1>
<div class="tabs" id="tabs"></div>
<div class="bar">
<input id="q" type="search" placeholder="搜尋書名、作者、出版社、平台…">
<select id="sort"><option value="title">排序：書名</option><option value="date">排序：購買日(新→舊)</option><option value="price">排序：金額(高→低)</option><option value="status">排序：閱讀狀態</option></select>
<select id="fp"></select><select id="fs"></select>
<label><input type="checkbox" id="grp" checked> 合併系列</label>
</div>
<div class="bar"><span id="stat"></span>
<button class="pri" id="add">＋ 新增</button><button id="imp">匯入</button><button id="exp">備份</button><button id="clr0" style="color:#b5524a">清空全部</button></div>
</header>
<main id="list"></main>

<dialog id="dlg"><form method="dialog" id="frm"><div class="fg" id="fg"></div>
<div class="bar"><button type="button" class="pri" id="sv">儲存</button><button type="button" id="cn">取消</button><button type="button" id="del" style="margin-left:auto;color:#b5524a">刪除</button></div></form></dialog>

<dialog id="idlg"><p style="margin-top:0">貼上 Google 試算表的列（含或不含標題列皆可），或選擇備份檔(.json/.tsv)。重複的書（書名＋集數＋型態＋平台相同）會自動跳過。</p>
<textarea id="ta" placeholder="從試算表複製後貼在這裡"></textarea>
<div class="bar"><input type="file" id="file" accept=".json,.tsv,.txt"><label><input type="checkbox" id="clr"> 先清空現有資料</label><button class="pri" id="go">匯入</button><button id="ic">關閉</button></div></dialog>

<datalist id="dl-series"></datalist><datalist id="dl-author"></datalist><datalist id="dl-pub"></datalist><datalist id="dl-plat"></datalist>

<script>
const K='booklist_v1',$=i=>document.getElementById(i);
const ST=['待購','未讀','閱讀中','完讀','棄讀'];
const OPT={type:['小說','漫畫','圖文書','知識書','雜誌'],cat:['','日漫','台漫','韓漫'],serial:['','連載','連載完結','單行本'],fmt:['','實體','電子書','租借','網路小說'],status:ST,cur:['TWD','JPY']};
const FLD=[['title','書名*','series','w'],['series','系列(留空=書名)','series'],['vol','集數'],['author','作者','author'],['pub','出版社','pub'],['type','類型'],['cat','漫畫分類'],['serial','連載狀態'],['fmt','型態'],['plat','平台/管道','plat'],['price','金額'],['cur','幣別'],['status','閱讀狀態'],['date','購買/借閱日期']];
const TABS={'全部':()=>1,'小說':b=>b.type==='小說','漫畫':b=>b.type==='漫畫','圖書館':b=>b.fmt==='租借'||b.plat==='圖書館','知識/其他':b=>!['小說','漫畫'].includes(b.type)};
let B=[];try{B=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}
const S={tab:'全部',q:'',sort:'title',grp:true,fp:'',fs:'',open:new Set()};
let G=[],editing=null;
const save=()=>localStorage.setItem(K,JSON.stringify(B));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const vn=b=>parseFloat(b.vol)||0;
const uniq=k=>[...new Set(B.map(b=>b[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
const money=b=>b.price==null?'':b.price===0?'免費':(b.cur?'¥':'$')+b.price;

function parseTSV(t){
  const out=[];
  for(const line of t.split(/\r?\n/)){
    const c=line.split('\t').map(s=>s.trim());
    if(!c[0]||c[0]==='書名')continue;
    const [title,vol,author,pub,type,cat,serial,fmt,plat,pr,st,dt]=c;
    let series=title,v=vol||'';
    // 集數欄是「四國、聶家」這類子系列名 → 當成系列
    if(v&&!/\d/.test(v)&&v.length<=4&&!/^(全|上|下|壹|貳|參|特典版|番外篇)$/.test(v)){series=v;v='';}
    let d='';if(dt){d=dt.split('/').map((x,i)=>i?x.padStart(2,'0'):x).join('-');if(!/^\d{4}-\d\d-\d\d$/.test(d))d='';}
    const status=ST.includes(st)?st:(!fmt&&!plat&&!dt&&!pr?'待購':'未讀');
    out.push({id:uid(),title,series,vol:v,author:author||'',pub:pub||'',type:type||'',cat:cat||'',serial:serial||'',fmt:fmt||'',plat:plat||'',price:pr?(parseFloat(pr.replace(/[^\d.]/g,''))||0):null,cur:/¥/.test(pr||'')?'JPY':'',status,date:d});
  }
  return out;
}
const key=b=>[b.type,b.title,b.vol,b.fmt,b.plat].join('|');
function merge(rows){
  const seen=new Set(B.map(key));let add=0,skip=0;
  rows.forEach(b=>{if(seen.has(key(b))){skip++;return}seen.add(key(b));B.push(b);add++});
  save();render();return `新增 ${add} 筆，跳過重複 ${skip} 筆`;
}

function view(){
  let L=B.filter(TABS[S.tab]);
  if(S.fp)L=L.filter(b=>b.plat===S.fp);
  if(S.fs)L=L.filter(b=>b.status===S.fs);
  if(S.q){const q=S.q.toLowerCase();L=L.filter(b=>[b.title,b.series,b.vol,b.author,b.pub,b.plat].join(' ').toLowerCase().includes(q))}
  const m=new Map();
  L.forEach(b=>{const k=S.grp?b.series+'|'+b.type:b.id;if(!m.has(k))m.set(k,[]);m.get(k).push(b)});
  G=[...m].map(([k,a])=>{a.sort((x,y)=>vn(x)-vn(y)||x.title.localeCompare(y.title,'zh-Hant'));
    return{k,a,name:a[0].series,date:a.reduce((s,x)=>x.date>s?x.date:s,''),price:a.reduce((s,x)=>s+(x.cur?0:x.price||0),0),st:Math.min(...a.map(x=>ST.indexOf(x.status)))}});
  G.sort({title:(a,b)=>a.name.localeCompare(b.name,'zh-Hant'),date:(a,b)=>b.date.localeCompare(a.date),price:(a,b)=>b.price-a.price,status:(a,b)=>a.st-b.st}[S.sort]);
  return L;
}
const row=(b,inner)=>`<div class="row ${b.status}${inner?' in':''}"><div><b>${esc(b.title)}</b>${b.vol?` <span class="v">${esc(b.vol)}</span>`:''}<div class="s">${esc([b.author,b.pub].filter(Boolean).join('、'))}</div></div>
<div class="t">${[b.fmt,b.plat].filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
<div class="p">${money(b)}</div>
<select data-st="${b.id}" aria-label="閱讀狀態">${ST.map(s=>`<option${s===b.status?' selected':''}>${s}</option>`).join('')}</select>
<div class="d">${b.date}</div><button data-e="${b.id}">編輯</button></div>`;

function render(){
  const L=view();
  $('tabs').innerHTML=Object.keys(TABS).map(t=>`<button class="${t===S.tab?'on':''}" data-tab="${t}">${t}<small>${B.filter(TABS[t]).length}</small></button>`).join('');
  const opts=(l,a)=>`<option value="">${l}</option>`+a.map(x=>`<option${x===(l==='全部平台'?S.fp:S.fs)?' selected':''}>${esc(x)}</option>`).join('');
  $('fp').innerHTML=opts('全部平台',uniq('plat'));$('fs').innerHTML=opts('全部狀態',ST);
  [['series','series'],['author','author'],['pub','pub'],['plat','plat']].forEach(([k,id])=>$('dl-'+id).innerHTML=(k==='series'?[...new Set(B.map(b=>b.series))].sort():uniq(k)).map(x=>`<option value="${esc(x)}">`).join(''));
  const done=L.filter(b=>b.status==='完讀').length,sum=L.reduce((s,b)=>s+(b.cur?0:b.price||0),0),jp=L.reduce((s,b)=>s+(b.cur?b.price||0:0),0);
  $('stat').textContent=`${L.length} 筆・${new Set(L.map(b=>b.series+b.type)).size} 系列・完讀 ${done}・花費 $${sum.toLocaleString()}${jp?` ＋ ¥${jp.toLocaleString()}`:''}`;
  if(!B.length){$('list').innerHTML='<div class="empty">還沒有資料。按「匯入」貼上你的試算表，或「＋ 新增」。</div>';return}
  $('list').innerHTML=G.map((g,i)=>{
    if(g.a.length===1)return row(g.a[0]);
    const o=S.open.has(g.k)||S.q,dn=g.a.filter(b=>b.status==='完讀').length;
    return `<div class="gh" data-g="${i}"><span>${o?'▾':'▸'}</span><b>${esc(g.name)}</b><span class="tag">${esc(g.a[0].type)}</span><span class="s">${g.a.length} 冊・完讀 ${dn}/${g.a.length}・$${g.price.toLocaleString()}</span><button data-n="${i}">＋下一集</button></div>${o?g.a.map(b=>row(b,1)).join(''):''}`;
  }).join('')||'<div class="empty">沒有符合的書</div>';
}

// form
$('fg').innerHTML=FLD.map(([k,l,dl,w])=>{
  const f=OPT[k]?`<select id="f_${k}">${OPT[k].map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="f_${k}" ${dl?`list="dl-${dl}"`:''} type="${k==='date'?'date':k==='price'?'number':'text'}">`;
  return `<label class="${w||''}">${l}${f}</label>`}).join('');
function openForm(b,isNew){
  editing=isNew?null:b.id;
  FLD.forEach(([k])=>$('f_'+k).value=k==='cur'?(b?.cur||'TWD'):(b?.[k]??(k==='status'?'未讀':'')));
  $('del').style.display=isNew?'none':'';$('dlg').showModal();$('f_title').focus();
}
$('f_title').addEventListener('change',()=>{ // 輸入已有系列時自動帶入欄位
  const t=$('f_title').value.trim(),r=[...B].reverse().find(b=>b.series===t||b.title===t);
  if(!r||editing)return;
  ['series','author','pub','type','cat','serial','fmt','plat','price'].forEach(k=>{if(!$('f_'+k).value||k==='type'||k==='fmt'&&!$('f_fmt').value)$('f_'+k).value=r[k]??''});
});
$('sv').onclick=()=>{
  const o={};FLD.forEach(([k])=>o[k]=$('f_'+k).value.trim());
  if(!o.title)return alert('請輸入書名');
  o.price=o.price===''?null:(parseFloat(o.price)||0);o.cur=o.cur==='JPY'?'JPY':'';o.series=o.series||o.title;
  if(editing)Object.assign(B.find(x=>x.id===editing),o);
  else{
    const d=B.find(b=>b.title===o.title&&b.vol===o.vol&&b.type===o.type);
    if(d&&!confirm(`已有「${d.title} ${d.vol}」（${d.fmt||''} ${d.plat||''}）。仍要新增嗎？`))return;
    B.push({id:uid(),...o});
  }
  save();$('dlg').close();render();
};
$('cn').onclick=()=>$('dlg').close();
$('del').onclick=()=>{if(confirm('確定刪除這筆？')){B=B.filter(b=>b.id!==editing);save();$('dlg').close();render()}};

// events
$('add').onclick=()=>openForm(null,true);
$('q').oninput=e=>{S.q=e.target.value.trim();render()};
$('sort').onchange=e=>{S.sort=e.target.value;render()};
$('fp').onchange=e=>{S.fp=e.target.value;render()};
$('fs').onchange=e=>{S.fs=e.target.value;render()};
$('grp').onchange=e=>{S.grp=e.target.checked;render()};
$('list').onchange=e=>{const id=e.target.dataset.st;if(!id)return;B.find(b=>b.id===id).status=e.target.value;save();render()};
$('list').onclick=e=>{
  const t=e.target;
  if(t.dataset.e)return openForm(B.find(b=>b.id===t.dataset.e));
  if(t.dataset.n!==undefined){e.stopPropagation();const l=G[+t.dataset.n].a.at(-1),m=String(l.vol).match(/^(\d+)/);
    return openForm({...l,vol:m?String(+m[1]+1).padStart(m[1].length,'0'):'',status:'未讀',date:new Date().toISOString().slice(0,10)},true)}
  const g=t.closest('[data-g]');if(g){const k=G[+g.dataset.g].k;S.open.has(k)?S.open.delete(k):S.open.add(k);render()}
};
$('tabs').onclick=e=>{if(e.target.closest('[data-tab]')){S.tab=e.target.closest('[data-tab]').dataset.tab;render()}};

// import / export
$('imp').onclick=()=>$('idlg').showModal();
$('ic').onclick=()=>$('idlg').close();
$('file').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>$('ta').value=t)};
$('go').onclick=()=>{
  const t=$('ta').value.trim();if(!t)return;
  let rows;
  try{rows=t[0]==='['?JSON.parse(t).map(b=>({...b,id:b.id||uid()})):parseTSV(t)}catch(e){return alert('格式無法讀取')}
  if($('clr').checked){if(!confirm('確定清空現有 '+B.length+' 筆資料再匯入？'))return;B=[];$('clr').checked=false}alert(merge(rows));$('ta').value='';$('idlg').close();
};
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
let armed=0;$('clr0').onclick=e=>{const b=e.target;
  if(!armed){armed=1;b.textContent='再按一次：確定清空';setTimeout(()=>{armed=0;b.textContent='清空全部'},4000);return}
  armed=0;B=[];S.q='';S.tab='全部';S.fp='';S.fs='';try{localStorage.removeItem(K)}catch(e){}b.textContent='已清空 ✓';setTimeout(()=>b.textContent='清空全部',2000);render()};
$('exp').onclick=()=>{
  const d=new Date().toISOString().slice(0,10);
  if(confirm('下載 JSON 完整備份？（取消 = 下載可貼回試算表的 TSV）'))dl(`booklist-${d}.json`,JSON.stringify(B,null,1),'application/json');
  else dl(`booklist-${d}.tsv`,['書名\t集數\t作者\t出版社\t書籍類型\t漫畫分類\t連載\t書籍型態\t平台/購買管道\t金額\t閱讀狀態\t購買/借閱日期',...B.map(b=>[b.title,b.vol,b.author,b.pub,b.type,b.cat,b.serial,b.fmt,b.plat,b.price==null?'':(b.cur?'¥':'')+b.price,b.status,b.date.replaceAll('-','/')].join('\t'))].join('\n'),'text/tab-separated-values');
};
render();if(!B.length)$('idlg').showModal();
</script></body></html>
