<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>典典占卜日記 ✨</title>
<style>
:root {
  --bg: #0d0d1a;
  --bg2: #13132a;
  --bg3: #1a1a35;
  --card: #1e1e3f;
  --card2: #252550;
  --border: #2e2e60;
  --accent: #a78bfa;
  --accent2: #c4b5fd;
  --gold: #fbbf24;
  --gold2: #fde68a;
  --pink: #f472b6;
  --teal: #2dd4bf;
  --red: #f87171;
  --green: #4ade80;
  --text: #e2e0ff;
  --text2: #a8a4d4;
  --text3: #6b6890;
  --upright: #7dd3fc;
  --reversed: #fb923c;
  --shadow: 0 4px 24px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
}

/* ── NAV ── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(13,13,26,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 12px;
  height: 52px;
  gap: 2px;
  overflow-x: auto;
}
.nav-title {
  font-size: 16px; font-weight: 700;
  color: var(--accent2);
  white-space: nowrap;
  margin-right: 12px;
  letter-spacing: 0.02em;
}
.nav-btn {
  flex-shrink: 0;
  background: none; border: none;
  color: var(--text2); font-size: 12px;
  padding: 6px 10px; border-radius: 8px;
  cursor: pointer; white-space: nowrap;
  transition: all .2s;
}
.nav-btn:hover { background: var(--bg3); color: var(--accent2); }
.nav-btn.active { background: var(--accent); color: #fff; font-weight: 600; }

/* ── PAGES ── */
.page { display: none; padding: 68px 12px 24px; max-width: 900px; margin: 0 auto; }
.page.active { display: block; }

/* ── SECTION HEADINGS ── */
.section-title {
  font-size: 18px; font-weight: 700;
  color: var(--accent2);
  margin: 20px 0 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(to right, var(--border), transparent);
}

/* ── CARDS ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card.highlight {
  border-color: var(--accent);
  background: linear-gradient(135deg, var(--card), #221e45);
}

/* ── FORM ELEMENTS ── */
select, input[type="text"], input[type="date"], textarea {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 8px 10px;
  font-size: 13px;
  font-family: inherit;
  width: 100%;
  outline: none;
  transition: border-color .2s;
}
select:focus, input:focus, textarea:focus {
  border-color: var(--accent);
}
select option { background: var(--bg2); }
textarea { resize: vertical; min-height: 70px; }
label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; }

.row { display: flex; gap: 8px; flex-wrap: wrap; }
.col { flex: 1; min-width: 120px; }

/* ── BUTTONS ── */
.btn {
  background: var(--accent);
  color: #fff; border: none;
  border-radius: 8px; padding: 9px 18px;
  font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .2s;
  white-space: nowrap;
}
.btn:hover { background: var(--accent2); color: var(--bg); }
.btn.secondary {
  background: var(--bg3); color: var(--text2);
  border: 1px solid var(--border);
}
.btn.secondary:hover { border-color: var(--accent); color: var(--accent2); }
.btn.danger { background: #7f1d1d; color: var(--red); }
.btn.danger:hover { background: var(--red); color: #fff; }
.btn.gold { background: var(--gold); color: #1a1000; }
.btn.gold:hover { background: var(--gold2); }
.btn.sm { padding: 5px 10px; font-size: 11px; }

/* ── TAGS / BADGES ── */
.badge {
  display: inline-block;
  border-radius: 20px; padding: 2px 10px;
  font-size: 11px; font-weight: 600;
}
.badge.upright { background: rgba(125,211,252,0.15); color: var(--upright); border: 1px solid rgba(125,211,252,0.3); }
.badge.reversed { background: rgba(251,146,60,0.15); color: var(--reversed); border: 1px solid rgba(251,146,60,0.3); }
.badge.qianqian { background: rgba(251,191,36,0.15); color: var(--gold); border: 1px solid rgba(251,191,36,0.3); }
.badge.diandian { background: rgba(167,139,250,0.15); color: var(--accent2); border: 1px solid rgba(167,139,250,0.3); }
.badge.oracle { background: rgba(45,212,191,0.15); color: var(--teal); border: 1px solid rgba(45,212,191,0.3); }

/* ── POSITION TOGGLE ── */
.pos-toggle { display: flex; gap: 6px; margin-top: 6px; }
.pos-btn {
  flex: 1; padding: 7px; border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text2); cursor: pointer;
  font-size: 12px; font-weight: 600;
  transition: all .2s; text-align: center;
}
.pos-btn.selected-upright { background: rgba(125,211,252,0.2); border-color: var(--upright); color: var(--upright); }
.pos-btn.selected-reversed { background: rgba(251,146,60,0.2); border-color: var(--reversed); color: var(--reversed); }

/* ── CALENDAR ── */
.calendar-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.cal-nav-btn {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px;
  padding: 6px 14px; cursor: pointer; font-size: 14px;
}
.cal-nav-btn:hover { border-color: var(--accent); }
.calendar-month-title { font-size: 16px; font-weight: 700; color: var(--accent2); }
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-day-header {
  text-align: center; font-size: 11px;
  color: var(--text3); padding: 4px 0;
  font-weight: 600;
}
.cal-day {
  background: var(--bg3); border-radius: 8px;
  min-height: 52px; padding: 4px;
  cursor: pointer; border: 1px solid transparent;
  transition: border-color .15s;
  position: relative;
  overflow: hidden;
}
.cal-day:hover { border-color: var(--accent); }
.cal-day.today { border-color: var(--accent); }
.cal-day.empty { background: transparent; cursor: default; pointer-events: none; }
.cal-day.has-record { background: var(--card); }
.cal-day-num {
  font-size: 11px; color: var(--text2);
  font-weight: 600;
}
.cal-day.today .cal-day-num { color: var(--accent2); }
.cal-dots {
  display: flex; flex-wrap: wrap; gap: 2px; margin-top: 2px;
}
.cal-dot {
  width: 6px; height: 6px; border-radius: 50%;
}
.cal-dot.q { background: var(--gold); }
.cal-dot.d { background: var(--accent); }
.cal-dot.o { background: var(--teal); }
.cal-turtle-mini {
  font-size: 10px; line-height: 1; margin-top: 1px;
}

/* ── TODAY RECORD ── */
.turtle-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
}
.turtle-card {
  background: var(--bg3); border-radius: 10px;
  border: 2px solid transparent;
  padding: 10px 8px;
  cursor: pointer; transition: all .2s;
  text-align: center;
}
.turtle-card:hover { border-color: var(--gold); }
.turtle-card.selected { border-color: var(--gold); background: rgba(251,191,36,0.1); }
.turtle-emoji { font-size: 28px; margin-bottom: 4px; }
.turtle-name { font-size: 12px; font-weight: 700; color: var(--gold); }
.turtle-stone { font-size: 10px; color: var(--text3); }
.turtle-energy { font-size: 10px; color: var(--teal); margin-top: 2px; }

/* ── CARD STUDY ── */
.study-tabs {
  display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap;
}
.study-tab {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 14px;
  font-size: 12px; color: var(--text2);
  cursor: pointer; transition: all .2s;
}
.study-tab:hover { border-color: var(--accent); }
.study-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

.study-panel { display: none; }
.study-panel.active { display: block; }

.learn-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px; margin-bottom: 10px;
}
.learn-card-header {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 8px;
  margin-bottom: 12px;
}
.learn-card-title { font-size: 15px; font-weight: 700; color: var(--accent2); }
.learn-card-num { font-size: 11px; color: var(--text3); margin-top: 2px; }
.learn-card-archetype { font-size: 12px; color: var(--gold); }

.keyword-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.keyword {
  background: var(--bg3); border-radius: 20px;
  padding: 3px 10px; font-size: 11px;
  border: 1px solid var(--border);
}
.keyword.up { border-color: rgba(125,211,252,0.4); color: var(--upright); }
.keyword.rev { border-color: rgba(251,146,60,0.4); color: var(--reversed); }

.interp-table { width: 100%; border-collapse: collapse; }
.interp-table td {
  padding: 6px 8px; font-size: 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.interp-table td:first-child {
  width: 60px; color: var(--text3);
  font-weight: 600; white-space: nowrap;
}
.memory-tip {
  background: rgba(251,191,36,0.08);
  border: 1px solid rgba(251,191,36,0.2);
  border-radius: 8px; padding: 8px 10px;
  font-size: 12px; color: var(--gold2);
  margin-top: 10px;
}
.memory-tip::before { content: '💡 '; }

.progress-bar {
  background: var(--bg3); border-radius: 20px;
  height: 6px; overflow: hidden; margin-top: 4px;
}
.progress-fill {
  height: 100%; border-radius: 20px;
  background: linear-gradient(to right, var(--accent), var(--teal));
  transition: width .5s;
}

/* ── ORACLE ── */
.oracle-section {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px; margin-bottom: 12px;
}
.oracle-section-title {
  font-size: 13px; font-weight: 700;
  color: var(--teal); margin-bottom: 10px;
}
.oracle-card-selected {
  background: rgba(45,212,191,0.08);
  border: 1px solid rgba(45,212,191,0.3);
  border-radius: 8px; padding: 10px;
  margin-top: 8px; font-size: 13px;
  color: var(--teal);
}
.oracle-sum-display {
  background: var(--bg3); border-radius: 10px;
  padding: 12px; text-align: center; margin-top: 10px;
}
.oracle-sum-num { font-size: 28px; font-weight: 700; color: var(--gold); }
.oracle-sum-label { font-size: 11px; color: var(--text3); }
.oracle-result-card {
  background: linear-gradient(135deg, rgba(45,212,191,0.1), rgba(167,139,250,0.1));
  border: 1px solid var(--teal);
  border-radius: 10px; padding: 14px;
  margin-top: 10px; text-align: center;
}
.oracle-result-name { font-size: 16px; font-weight: 700; color: var(--teal); }
.oracle-result-num { font-size: 11px; color: var(--text3); margin-bottom: 4px; }

/* ── RECORD DETAIL MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 200;
  align-items: center; justify-content: center;
  padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 20px;
  max-width: 520px; width: 100%;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.modal-header {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 16px;
}
.modal-title { font-size: 16px; font-weight: 700; color: var(--accent2); }
.modal-close {
  background: none; border: none;
  color: var(--text3); font-size: 20px;
  cursor: pointer; padding: 4px;
}
.modal-close:hover { color: var(--text); }

/* ── RECORD LIST ── */
.record-item {
  background: var(--bg3); border-radius: 10px;
  border: 1px solid var(--border); padding: 12px;
  margin-bottom: 8px; cursor: pointer;
  transition: border-color .15s;
}
.record-item:hover { border-color: var(--accent); }
.record-item-date { font-size: 11px; color: var(--text3); margin-bottom: 6px; }
.record-item-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* ── MONTH SUMMARY ── */
.month-summary {
  background: linear-gradient(135deg, var(--card), var(--bg3));
  border: 1px solid var(--border);
  border-radius: 14px; padding: 16px;
  margin-bottom: 16px;
}
.summary-stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin-top: 10px;
}
.stat-box {
  background: var(--bg);
  border-radius: 10px; padding: 10px;
  text-align: center;
}
.stat-num { font-size: 22px; font-weight: 700; color: var(--accent2); }
.stat-label { font-size: 10px; color: var(--text3); }

/* ── ORACLE INNER LIGHT ── */
.il-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 6px;
}
.il-card-item {
  background: var(--bg3); border-radius: 8px;
  border: 1px solid var(--border);
  padding: 8px 10px; cursor: pointer;
  transition: all .2s; font-size: 12px;
}
.il-card-item:hover { border-color: var(--teal); color: var(--teal); }
.il-card-item.selected { border-color: var(--teal); background: rgba(45,212,191,0.1); color: var(--teal); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── UTILITY ── */
.flex { display: flex; }
.gap8 { gap: 8px; }
.gap4 { gap: 4px; }
.mt8 { margin-top: 8px; }
.mt12 { margin-top: 12px; }
.mt16 { margin-top: 16px; }
.mb8 { margin-bottom: 8px; }
.wrap { flex-wrap: wrap; }
.center { text-align: center; }
.text-sm { font-size: 12px; color: var(--text2); }
.text-xs { font-size: 11px; color: var(--text3); }
.text-accent { color: var(--accent2); }
.text-gold { color: var(--gold); }
.text-teal { color: var(--teal); }
.text-red { color: var(--red); }
.text-green { color: var(--green); }
.divider { height: 1px; background: var(--border); margin: 12px 0; }

.empty-state {
  text-align: center; padding: 40px 20px;
  color: var(--text3);
}
.empty-state .emoji { font-size: 40px; margin-bottom: 8px; }

@media (max-width: 480px) {
  .summary-stats { grid-template-columns: repeat(2,1fr); }
  .turtle-grid { grid-template-columns: repeat(3,1fr); }
  .cal-day { min-height: 44px; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-title">✨ 典典</div>
  <button class="nav-btn active" onclick="showPage('calendar')">📅 月曆</button>
  <button class="nav-btn" onclick="showPage('today')">🌙 今日記錄</button>
  <button class="nav-btn" onclick="showPage('study')">📖 牌義學習</button>
  <button class="nav-btn" onclick="showPage('oracle')">🔮 神諭卡</button>
  <button class="nav-btn" onclick="showPage('turtles')">🐢 龍龜庫</button>
</nav>

<!-- ===== PAGE: CALENDAR ===== -->
<div class="page active" id="page-calendar">
  <div class="month-summary" id="monthSummary"></div>

  <div class="calendar-header">
    <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
    <div class="calendar-month-title" id="calMonthTitle"></div>
    <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
  </div>
  <div class="cal-grid" id="calDayHeaders"></div>
  <div class="cal-grid mt8" id="calGrid"></div>

  <div class="section-title mt16">📋 本月紀錄</div>
  <div id="monthRecordList"></div>
</div>

<!-- ===== PAGE: TODAY RECORD ===== -->
<div class="page" id="page-today">
  <div class="section-title">🌙 今日占卜記錄</div>

  <!-- DATE -->
  <div class="card">
    <div class="row">
      <div class="col">
        <label>日期</label>
        <input type="date" id="recordDate">
      </div>
    </div>
  </div>

  <!-- QIANQIAN (錢錢 - 熊貓之道大牌) -->
  <div class="card">
    <div class="flex gap8 mb8" style="align-items:center;justify-content:space-between;">
      <div style="font-size:14px;font-weight:700;color:var(--gold);">🐼 錢錢</div>
      <span class="badge qianqian">熊貓之道・大牌</span>
    </div>
    <label>抽到的大牌</label>
    <select id="qqCard" onchange="updateQQPreview()">
      <option value="">— 選擇牌 —</option>
    </select>
    <div id="qqCardPreview"></div>
    <!-- 龍龜推薦 -->
    <div class="mt12">
      <div class="flex gap8 mb8" style="align-items:center;justify-content:space-between;">
        <label style="margin:0;">🐢 今日陪伴龍龜</label>
        <span id="turtleSuggestBadge" class="text-xs" style="color:var(--teal);"></span>
      </div>
      <div id="turtleSuggestBox"></div>
      <div class="turtle-grid mt8" id="qqTurtleGrid"></div>
    </div>
  </div>

  <!-- DIANDIAN (典典 - 萊德偉特) -->
  <div class="card">
    <div class="flex gap8 mb8" style="align-items:center;justify-content:space-between;">
      <div style="font-size:14px;font-weight:700;color:var(--accent2);">🃏 典典</div>
      <span class="badge diandian">萊德偉特・78張</span>
    </div>
    <label>抽到的牌</label>
    <select id="ddCard" onchange="updateDDCard()">
      <option value="">— 選擇牌 —</option>
    </select>
    <div class="pos-toggle mt8">
      <div class="pos-btn" id="ddPosUp" onclick="setPos('dd','upright')">🌅 正位</div>
      <div class="pos-btn" id="ddPosRev" onclick="setPos('dd','reversed')">🌒 逆位</div>
    </div>
    <div id="ddCardPreview" class="mt8"></div>
  </div>

  <!-- ORACLE (神諭卡快選) -->
  <div class="card">
    <div class="flex gap8 mb8" style="align-items:center;justify-content:space-between;">
      <div style="font-size:14px;font-weight:700;color:var(--teal);">🔮 神諭卡</div>
      <span class="badge oracle">選填</span>
    </div>
    <select id="oracleType" onchange="updateOracleQuick()">
      <option value="">— 不使用神諭卡 —</option>
      <option value="inner">啟動內在光能神諭卡</option>
      <option value="omen">預兆神諭卡</option>
    </select>
    <div id="oracleQuickPick" class="mt8"></div>
  </div>

  <!-- EVENT & NOTES -->
  <div class="card">
    <label>📝 今日事件</label>
    <textarea id="eventText" placeholder="今天發生了什麼事？工作、感情、生活... 隨意記錄"></textarea>
    <label class="mt8">✍️ 解析備註（對應分析）</label>
    <textarea id="notesText" placeholder="這張牌如何呼應今天的事件？直覺感受、關鍵字..."></textarea>
    <label class="mt8">🌟 驗證（事後回看）</label>
    <select id="verifySelect">
      <option value="">—</option>
      <option value="✅">✅ 完全準確</option>
      <option value="🔶">🔶 部分對應</option>
      <option value="❓">❓ 待觀察</option>
      <option value="❌">❌ 未對應</option>
    </select>
  </div>

  <div class="flex gap8 mt8">
    <button class="btn" onclick="saveRecord()" style="flex:1;">💾 儲存記錄</button>
    <button class="btn secondary" onclick="clearTodayForm()">🔄 清除</button>
  </div>
  <div id="saveMsg" class="text-sm center mt8"></div>
</div>

<!-- ===== PAGE: STUDY ===== -->
<div class="page" id="page-study">
  <div class="section-title">📖 牌義學習庫</div>

  <div class="study-tabs">
    <button class="study-tab active" onclick="switchStudyTab('major')">大牌</button>
    <button class="study-tab" onclick="switchStudyTab('wands')">權杖</button>
    <button class="study-tab" onclick="switchStudyTab('cups')">聖杯</button>
    <button class="study-tab" onclick="switchStudyTab('swords')">寶劍</button>
    <button class="study-tab" onclick="switchStudyTab('pents')">錢幣</button>
  </div>

  <!-- Progress -->

function buildCardSelect(selId, cards, majorOnly) {
  const sel = document.getElementById(selId);
  sel.innerHTML = '<option value="">— 選擇牌 —</option>';
  cards.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.name;
    opt.textContent = (c.num ? `${c.num}. ` : '') + c.name;
    sel.appendChild(opt);
  });
}

function buildDDSelectRW() {
  const sel = document.getElementById('ddCard');
  sel.innerHTML = '<option value="">— 選擇牌 —</option>';
  const groups = {
    '✨ 大阿爾克那': MAJOR_ARCANA,
    '🔥 權杖': MINOR_WANDS,
    '💧 聖杯': MINOR_CUPS,
    '⚔️ 寶劍': MINOR_SWORDS,
    '🪙 錢幣': MINOR_PENTS,
  };
  Object.entries(groups).forEach(([g, arr]) => {
    const grp = document.createElement('optgroup');
    grp.label = g;
    arr.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.name;
      opt.textContent = c.name;
      grp.appendChild(opt);
    });
    sel.appendChild(grp);
  });
}

function updateQQPreview() {
  const val = document.getElementById('qqCard').value;
  const card = MAJOR_ARCANA.find(c => c.name === val);
  const el = document.getElementById('qqCardPreview');
  if (!card) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="oracle-card-selected mt8">
    <b>${card.star || ''} ${card.name}</b><br>
    <span class="text-xs">${card.archetype}</span>
  </div>`;

  // 推薦龍龜
  const suggest = QQ_TURTLE_MAP[val];
  const badgeEl = document.getElementById('turtleSuggestBadge');
  const boxEl = document.getElementById('turtleSuggestBox');
  if (suggest) {
    const t = TURTLES.find(t => t.id === suggest.id);
    badgeEl.textContent = '✨ 自動推薦';
    boxEl.innerHTML = `<div style="
      background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.25);
      border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;
      cursor:pointer;" onclick="selectTurtle('${t.id}')">
      <span style="font-size:28px;">${t.emoji}</span>
      <div>
        <div style="font-weight:700;color:var(--gold);font-size:13px;">${t.name}</div>
        <div style="font-size:11px;color:var(--text3);">${t.stone}</div>
        <div style="font-size:11px;color:var(--teal);margin-top:2px;">${suggest.reason}</div>
      </div>
    </div>
    <div class="text-xs" style="color:var(--text3);margin-bottom:6px;">或手動選擇其他龍龜 ↓</div>`;
    // auto-select
    selectTurtle(t.id);
  } else {
    badgeEl.textContent = '';
    boxEl.innerHTML = '';
  }
}

function updateDDCard() {
  const val = document.getElementById('ddCard').value;
  const card = ALL_TAROT.find(c => c.name === val);

function renderTurtleGrid(containerId, selectable) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '';
  TURTLES.forEach(t => {
    const d = document.createElement('div');
    d.className = 'turtle-card';
    d.id = 'tg_' + t.id;
    d.innerHTML = `<div class="turtle-emoji">${t.emoji}</div>
      <div class="turtle-name">${t.name}</div>
      <div class="turtle-stone">${t.stone}</div>
      <div class="turtle-energy">${t.energy.substring(0,12)}...</div>`;
    if (selectable) {
      d.onclick = () => selectTurtle(t.id);
    }
    el.appendChild(d);
  });
}

function selectTurtle(id) {
  selectedQQTurtle = id;
  document.querySelectorAll('#qqTurtleGrid .turtle-card').forEach(c => c.classList.remove('selected'));
  const el = document.getElementById('tg_' + id);
  if (el) el.classList.add('selected');
}

function saveRecord() {
  const date = document.getElementById('recordDate').value;
  if (!date) { showSaveMsg('請選擇日期！', 'red'); return; }

  const quickOracleSel = document.getElementById('oracleQuickSel');
  const record = {
    date,
    qq: {
      card: document.getElementById('qqCard').value,
      turtle: selectedQQTurtle,
    },
    dd: {
      deck: 'rw',
      card: document.getElementById('ddCard').value,
      pos: selectedDDPos,
    },
    oracle: {
      type: document.getElementById('oracleType').value,
      card: quickOracleSel ? quickOracleSel.value : '',
    },
    event: document.getElementById('eventText').value,
    notes: document.getElementById('notesText').value,
    verify: document.getElementById('verifySelect').value,
    savedAt: new Date().toISOString(),
  };

  records[date] = record;
  localStorage.setItem('divRecords', JSON.stringify(records));
  showSaveMsg('✅ 記錄已儲存！', 'green');
  renderCalendar();
}

function showSaveMsg(msg, color) {
  const el = document.getElementById('saveMsg');

  setTimeout(() => el.textContent = '', 3000);
}

// ═══════════════════════════════════════════════
// CALENDAR
// ═══════════════════════════════════════════════

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}

function renderCalendar() {
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calMonthTitle').textContent = `${calYear} 年 ${monthNames[calMonth]}`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const today = todayStr();

  // Empty cells
  for (let i = 0; i < firstDay; i++) {
    const d = document.createElement('div');
    d.className = 'cal-day empty';
    grid.appendChild(d);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const rec = records[dateStr];
    const d = document.createElement('div');
    d.className = 'cal-day' + (dateStr === today ? ' today' : '') + (rec ? ' has-record' : '');

    let dotsHTML = '';
    let turtleHTML = '';
    if (rec) {
      if (rec.qq?.card) dotsHTML += '<div class="cal-dot q" title="錢錢"></div>';
      if (rec.dd?.card) dotsHTML += '<div class="cal-dot d" title="典典"></div>';
      if (rec.oracle?.card) dotsHTML += '<div class="cal-dot o" title="神諭"></div>';
      if (rec.qq?.turtle) {
        const t = TURTLES.find(t=>t.id===rec.qq.turtle);
        if (t) turtleHTML = `<div class="cal-turtle-mini">${t.emoji}</div>`;
      }
    }

    d.innerHTML = `<div class="cal-day-num">${day}</div>
      <div class="cal-dots">${dotsHTML}</div>
      ${turtleHTML}`;

    if (rec) d.onclick = () => openDayModal(dateStr);
    grid.appendChild(d);
  }

  renderMonthSummary();
  renderMonthRecordList();
}

function renderMonthSummary() {
  const prefix = `${calYear}-${String(calMonth+1).padStart(2,'0')}`;
  const monthRecs = Object.entries(records).filter(([d])=>d.startsWith(prefix));

  const totalDays = monthRecs.length;
  const qqCount = monthRecs.filter(([,r])=>r.qq?.card).length;
  const ddCount = monthRecs.filter(([,r])=>r.dd?.card).length;
  const verifyAccurate = monthRecs.filter(([,r])=>r.verify==='✅').length;

  // Most used turtle
  const turtleCounts = {};
  monthRecs.forEach(([,r])=>{
    if (r.qq?.turtle) turtleCounts[r.qq.turtle] = (turtleCounts[r.qq.turtle]||0)+1;
  });
  const topTurtleId = Object.entries(turtleCounts).sort((a,b)=>b[1]-a[1])[0]?.[0];
  const topTurtle = TURTLES.find(t=>t.id===topTurtleId);

  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('monthSummary').innerHTML = `
    <div class="flex gap8" style="align-items:center;justify-content:space-between;flex-wrap:wrap;">
      <div>
        <div style="font-size:13px;color:var(--text3);">本月總覽</div>
        <div style="font-size:18px;font-weight:700;color:var(--accent2)">${calYear}年${monthNames[calMonth]}</div>
      </div>
      ${topTurtle ? `<div style="text-align:center;">
        <div style="font-size:28px;">${topTurtle.emoji}</div>
        <div style="font-size:10px;color:var(--gold);">本月守護龜</div>
        <div style="font-size:11px;color:var(--text2)">${topTurtle.name}</div>
      </div>` : ''}
    </div>
    <div class="summary-stats">
      <div class="stat-box">
        <div class="stat-num">${totalDays}</div>
        <div class="stat-label">記錄天數</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" style="color:var(--gold)">${qqCount}</div>
        <div class="stat-label">錢錢記錄</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" style="color:var(--accent2)">${ddCount}</div>
        <div class="stat-label">典典記錄</div>
      </div>
    </div>
    ${verifyAccurate > 0 ? `<div class="text-xs mt8" style="color:var(--green);">✅ 本月準確對應：${verifyAccurate} 次</div>` : ''}`;
}

function renderMonthRecordList() {
  const prefix = `${calYear}-${String(calMonth+1).padStart(2,'0')}`;
  const monthRecs = Object.entries(records)
    .filter(([d])=>d.startsWith(prefix))
    .sort((a,b)=>b[0].localeCompare(a[0]));

  const el = document.getElementById('monthRecordList');
  if (monthRecs.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emoji">🌙</div><div>本月尚無記錄</div></div>';
    return;
  }
  el.innerHTML = monthRecs.map(([date, r]) => {
    const t = r.qq?.turtle ? TURTLES.find(tt=>tt.id===r.qq.turtle) : null;
    return `<div class="record-item" onclick="openDayModal('${date}')">
      <div class="record-item-date">${date} ${r.verify||''}</div>
      <div class="record-item-row">
        ${r.qq?.card ? `<span class="badge qianqian">錢錢: ${r.qq.card.split(' ')[0]}</span>` : ''}
        ${r.dd?.card ? `<span class="badge diandian">典典: ${r.dd.card.split(' ')[0]}</span>` : ''}
        ${r.dd?.pos ? `<span class="badge ${r.dd.pos==='upright'?'upright':'reversed'}">${r.dd.pos==='upright'?'正':'逆'}</span>` : ''}
        ${t ? `<span>${t.emoji}</span>` : ''}
      </div>
      ${r.event ? `<div class="text-xs mt8" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%">${r.event.substring(0,40)}${r.event.length>40?'...':''}</div>` : ''}
    </div>`;
  }).join('');
}

function openDayModal(dateStr) {
  currentModalDate = dateStr;
  const r = records[dateStr];
  if (!r) return;

  document.getElementById('modalTitle').textContent = `📅 ${dateStr}`;

  const turtle = r.qq?.turtle ? TURTLES.find(t=>t.id===r.qq.turtle) : null;

  document.getElementById('modalContent').innerHTML = `
    ${r.qq?.card ? `<div class="card" style="margin-bottom:8px;">
      <div style="font-weight:700;color:var(--gold);margin-bottom:6px;">🐼 錢錢</div>
      <div style="font-size:14px;">${r.qq.card}</div>
      ${turtle ? `<div class="mt8" style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:20px;">${turtle.emoji}</span>
        <span style="font-size:12px;color:var(--gold)">${turtle.name}</span>
        <span style="font-size:11px;color:var(--text3)">${turtle.stone}</span>
      </div>` : ''}
    </div>` : ''}

    ${r.dd?.card ? `<div class="card" style="margin-bottom:8px;">
      <div class="flex gap8 mb8" style="align-items:center;justify-content:space-between;">
        <span style="font-weight:700;color:var(--accent2);">🃏 典典</span>
        ${r.dd.pos ? `<span class="badge ${r.dd.pos==='upright'?'upright':'reversed'}">${r.dd.pos==='upright'?'🌅 正位':'🌒 逆位'}</span>` : ''}
      </div>
      <div style="font-size:14px;">${r.dd.card}</div>
      <div style="font-size:11px;color:var(--text3)">${r.dd.deck==='panda'?'熊貓之道':'萊德偉特'}</div>
    </div>` : ''}

    ${r.oracle?.card ? `<div class="card" style="margin-bottom:8px;">
      <div style="font-weight:700;color:var(--teal);margin-bottom:6px;">🔮 神諭卡</div>
      <div style="font-size:13px;">${r.oracle.card}</div>
    </div>` : ''}

    ${r.event ? `<div class="card" style="margin-bottom:8px;">
      <div class="text-xs mb4">📝 今日事件</div>
      <div style="font-size:13px;line-height:1.6">${r.event}</div>
    </div>` : ''}

    ${r.notes ? `<div class="card" style="margin-bottom:8px;">
      <div class="text-xs mb4">✍️ 解析備註</div>
      <div style="font-size:13px;line-height:1.6">${r.notes}</div>
    </div>` : ''}

    ${r.verify ? `<div class="text-sm">驗證：${r.verify}</div>` : ''}
  `;

  document.getElementById('dayModal').classList.add('open');
}

function closeModal() {
  document.getElementById('dayModal').classList.remove('open');
  currentModalDate = null;
}

function loadRecordToEdit() {
  if (!currentModalDate) return;
  const r = records[currentModalDate];
  if (!r) return;

  // Switch to today page and populate
  showPage('today');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.nav-btn')[1].classList.add('active');

  document.getElementById('recordDate').value = r.date;
  document.getElementById('qqCard').value = r.qq?.card || '';
  updateQQPreview();
  if (r.qq?.turtle) selectTurtle(r.qq.turtle);

  document.getElementById('ddCard').value = r.dd?.card || '';
  updateDDCard();
  if (r.dd?.pos) setPos('dd', r.dd.pos);

  document.getElementById('oracleType').value = r.oracle?.type || '';
  updateOracleQuick();

  document.getElementById('eventText').value = r.event || '';
  document.getElementById('notesText').value = r.notes || '';
  document.getElementById('verifySelect').value = r.verify || '';

  closeModal();
}

function deleteCurrentRecord() {
  if (!currentModalDate) return;
  if (!confirm(`確定刪除 ${currentModalDate} 的記錄？`)) return;
  delete records[currentModalDate];
  localStorage.setItem('divRecords', JSON.stringify(records));
  closeModal();
  renderCalendar();
}

function renderInnerLight() {
  const el = document.getElementById('innerLightGrid');
  INNER_LIGHT_CARDS.forEach(group => {
    const hdr = document.createElement('div');
    hdr.style.cssText = 'grid-column:1/-1;font-size:11px;color:var(--teal);font-weight:700;margin-top:8px;';
    hdr.textContent = group.g;
    el.appendChild(hdr);
    group.cards.forEach(c => {
      const d = document.createElement('div');
      d.className = 'il-card-item';
      d.textContent = c;
      d.onclick = () => toggleILCard(c, d);
      el.appendChild(d);
    });
  });
}

function toggleILCard(name, el) {
  if (selectedILCards.has(name)) {
    selectedILCards.delete(name);
    el.classList.remove('selected');
  } else {
    selectedILCards.add(name);
    el.classList.add('selected');
  }
  updateILSelected();
}

function updateILSelected() {
  const el = document.getElementById('innerLightSelected');
  if (selectedILCards.size === 0) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="oracle-card-selected">
    <div class="text-xs mb8">已選擇 ${selectedILCards.size} 張</div>
    ${[...selectedILCards].map(c=>`<div>✨ ${c}</div>`).join('')}
  </div>`;
}

  OMEN_G1.forEach(c => {

    opt.textContent = `${c.n}. ${c.name}`;

  });
  const s2 = document.getElementById('omenG2');

    s2.appendChild(opt);
  });
  const s3 = document.getElementById('omenG3');
  OMEN_G3.forEach(c => {

    s3.appendChild(opt);
  });
}

function calcOmenSum() {
  const getVals = id => Array.from(document.getElementById(id).selectedOptions).map(o=>parseInt(o.value));
  const nums = [...getVals('omenG1'), ...getVals('omenG2'), ...getVals('omenG3')];

  if (nums.length === 0) {
    document.getElementById('omenSumDisplay').innerHTML = '';
    return;
  }

  const rawSum = nums.reduce((a,b)=>a+b, 0);

  // Digit sum reduction to ≤77
  let reduced = rawSum;
  while (reduced > 77) {
    reduced = String(reduced).split('').reduce((a,b)=>a+parseInt(b), 0);
  }

  const allOmen = [...OMEN_G1, ...OMEN_G2, ...OMEN_G3];
  const resultCard = allOmen.find(c=>c.n===reduced);

  document.getElementById('omenSumDisplay').innerHTML = `
    <div class="oracle-sum-display">
      <div class="oracle-sum-label">選取牌號：${nums.join(' + ')} = ${rawSum}</div>
      ${rawSum !== reduced ? `<div class="oracle-sum-label">數字化簡：→ ${reduced}</div>` : ''}
      <div class="oracle-sum-num">${reduced}</div>
    </div>
    ${resultCard ? `<div class="oracle-result-card">
      <div class="oracle-result-num">No.${resultCard.n}</div>
      <div class="oracle-result-name">${resultCard.name}</div>
      <div class="text-xs mt8">✨ 這是你的對應牌</div>
    </div>` : ''}`;
}
