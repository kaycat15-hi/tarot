<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>手搖紀錄</title>
<style>
:root{
  --c1:#FFFDF5; --c2:#FFF8DC; --c3:#FFE082; --c4:#F4C95D; --c5:#D9A441;
  --tea:#5A3820; --tea2:#9C6B3E; --line:#EDD98A;
  --pearl:#2E1F0F; --bg:rgba(255,255,255,.82); --danger:#C0392B;
  --nav-h:62px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:"PingFang TC","Noto Sans TC",sans-serif;
  background:linear-gradient(170deg,var(--c1) 0%,var(--c2) 50%,var(--c3) 100%);
  background-attachment:fixed;
  color:var(--pearl);
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
}

/* ══ BOTTOM NAV ══ */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:rgba(255,252,232,.97); backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:flex; align-items:flex-start; justify-content:space-around;
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding-top:10px; cursor:pointer; gap:3px;
}
.nav-icon{font-size:22px; line-height:1; color:var(--tea2);}
.nav-lbl{font-size:11px; color:var(--tea2); font-weight:500;}
.nav-item.active .nav-icon{color:var(--c5);}
.nav-item.active .nav-lbl{color:var(--c5); font-weight:700;}
.nav-add{
  flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding-top:6px; cursor:pointer; gap:3px;
}
.nav-add-circle{
  width:46px; height:46px; border-radius:50%;
  background:linear-gradient(135deg,var(--c4),var(--c5));
  display:flex; align-items:center; justify-content:center;
  font-size:26px; color:#fff; line-height:1;
  box-shadow:0 3px 10px rgba(217,164,65,.5);
  margin-top:-18px;
}
.nav-add-circle.active-add{background:linear-gradient(135deg,#888,#555);}
.nav-add .nav-lbl{font-size:11px; color:var(--tea2); font-weight:500;}

/* ══ PAGES ══ */
.page{display:none; padding:0 0 8px;}
.page.active{display:block;}

/* ══ PAGE HEADER ══ */
.pg-header{
  padding:20px 18px 10px; text-align:center;
  font-size:22px; font-weight:800; color:var(--tea); letter-spacing:1px;
}

/* ══ CALENDAR ══ */
.cal-wrap{padding:0 14px;}
.cal-nav-row{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;
}
.cal-arrow{
  background:none; border:none; font-size:22px; color:var(--tea2);
  cursor:pointer; padding:4px 10px; line-height:1;
}
.cal-month-lbl{font-size:18px; font-weight:700; color:var(--tea);}
.cal-wd-row{
  display:grid; grid-template-columns:repeat(7,1fr); text-align:center;
  margin-bottom:4px;
}
.cal-wd{font-size:12px; color:var(--tea2); padding:4px 0; font-weight:500;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-cell{
  height:42px; border-radius:10px; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  font-size:14px; font-weight:500; color:var(--pearl);
  background:rgba(255,255,255,.5); cursor:pointer; position:relative;
}
.cal-cell.empty{background:none; cursor:default;}
.cal-cell.other-month{color:#ccc; background:rgba(255,255,255,.2);}
.cal-cell.has{
  background:linear-gradient(145deg,#FFE9A8,var(--c4)); font-weight:700;
}
.cal-cell .cal-dot{
  width:5px; height:5px; border-radius:50%;
  background:var(--c5); position:absolute; bottom:4px;
}
.cal-cell.has .cal-dot{background:var(--tea);}
.cal-cell.today{
  background:linear-gradient(135deg,var(--c4),var(--c5));
  color:#fff; font-weight:800;
}
.cal-cell.today .cal-dot{background:#fff;}
.cal-cell.sel{outline:2.5px solid var(--tea); outline-offset:0;}

.month-box{
  margin:14px 0 10px; padding:14px 18px; border-radius:14px;
  background:rgba(255,255,255,.6); border:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:center;
}
.month-box .mb-lbl{font-size:13px; color:var(--tea2);}
.month-box .mb-num{font-size:24px; font-weight:800; color:var(--c5);}

/* day detail */
.day-section{padding:0 14px;}
.day-title{
  font-size:13px; font-weight:700; color:var(--tea2); margin-bottom:6px;
}
.day-card{
  background:var(--bg); border:1px solid var(--line);
  border-radius:14px; overflow:hidden;
}

/* ══ RECORD ITEM ══ */
.rec-item{
  display:flex; gap:10px; padding:12px 14px; border-bottom:1px solid #f5e9c0;
  cursor:pointer; align-items:stretch;
}
.rec-item:last-child{border-bottom:none;}
.rec-bar{width:4px; border-radius:3px; flex-shrink:0; align-self:stretch; min-height:20px;}
.rec-body{flex:1; min-width:0;}
.rec-row1{display:flex; justify-content:space-between; align-items:center; gap:8px;}
.rec-shop{font-size:16px; font-weight:700; color:var(--tea);}
.rec-price{font-size:15px; font-weight:700; color:var(--c5); flex-shrink:0;}
.rec-stars{font-size:13px; color:#E8A23D; margin-left:4px;}
.rec-row2{font-size:13px; color:var(--tea2); margin-top:3px;}
.rec-tags{display:flex; gap:5px; margin-top:5px; flex-wrap:wrap;}
.rec-tag{
  padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:500;
  background:#E8F4FF; color:#4A80B0; border:1px solid #C2DDEE;
}
.rec-note-txt{font-size:12px; color:#957a4a; margin-top:4px; font-style:italic;}
.empty-state{text-align:center; padding:32px 16px; color:var(--tea2); font-size:14px;}

/* ══ ADD FORM PAGE ══ */
.form-page-wrap{padding:0 18px 12px;}
.form-field{
  display:flex; align-items:center; gap:14px;
  border-bottom:1px solid var(--line); padding:14px 0;
}
.form-field .fi{font-size:20px; width:26px; text-align:center; flex-shrink:0; color:var(--tea2);}
.form-field input, .form-field textarea{
  flex:1; border:none; background:transparent; font-size:16px;
  color:var(--pearl); font-family:inherit; outline:none;
  min-width:0;
}
.form-field input::placeholder,.form-field textarea::placeholder{color:#bba876;}
.form-field textarea{resize:none; height:22px; line-height:1.4;}
.form-section-lbl{
  font-size:15px; font-weight:700; color:var(--tea);
  padding:14px 0 8px;
}
.star-row{display:flex; gap:6px; padding-bottom:4px;}
.star-btn{font-size:32px; color:#e0d5b5; cursor:pointer; line-height:1;}
.star-btn.on{color:#E8A23D;}
.chip-group{display:flex; flex-wrap:wrap; gap:7px; padding-bottom:6px;}
.chip{
  padding:8px 14px; border-radius:999px; font-size:14px;
  border:1.5px solid var(--line); background:rgba(255,255,255,.7);
  color:var(--tea2); cursor:pointer; user-select:none; font-weight:500;
  display:flex; align-items:center; gap:5px;
}
.chip.sel{
  background:linear-gradient(135deg,var(--c4),var(--c5));
  color:#fff; border-color:var(--c5); font-weight:700;
}
.chip.sel::before{content:"✓ ";}

/* action buttons */
.action-row{display:flex; gap:10px; margin-top:18px;}
.btn{
  flex:1; padding:14px; border:none; border-radius:13px; font-size:15px;
  font-weight:700; cursor:pointer;
}
.btn-primary{background:linear-gradient(135deg,var(--c4),var(--c5)); color:#fff;}
.btn-secondary{background:rgba(255,255,255,.8); color:var(--tea2); border:1.5px solid var(--line);}
.btn-danger{background:var(--danger); color:#fff; width:100%; margin-top:10px;}
.del-confirm{
  display:none; background:#fff5f5; border:1px solid #f5c0b0;
  border-radius:12px; padding:12px 14px; margin-top:10px; text-align:center;
}
.del-confirm.show{display:block;}
.del-confirm p{font-size:13px; color:var(--danger); font-weight:600; margin-bottom:10px;}
.del-confirm .action-row{margin-top:0;}

/* ══ STATS PAGE ══ */
.stats-wrap{padding:0 14px;}
.seg-ctrl{
  display:flex; border-radius:12px; overflow:hidden;
  border:1.5px solid var(--line); margin-bottom:12px;
}
.seg-btn{
  flex:1; padding:10px; text-align:center; font-size:14px;
  background:transparent; color:var(--tea2); cursor:pointer; font-weight:500;
  border:none;
}
.seg-btn.active{
  background:linear-gradient(135deg,var(--c4),var(--c5));
  color:#fff; font-weight:700;
}
.stat-nav{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;
}
.stat-nav button{
  background:none; border:1.5px solid var(--line); border-radius:10px;
  font-size:16px; color:var(--tea2); cursor:pointer; padding:6px 16px;
}
.stat-lbl{font-size:17px; font-weight:700; color:var(--tea);}
.pie-wrap{text-align:center; margin-bottom:10px;}
canvas#pieChart{max-width:220px;}
.legend-list{margin:10px 0;}
.legend-row{
  display:flex; align-items:center; gap:8px; padding:6px 0;
  border-bottom:1px solid var(--line); font-size:14px;
}
.legend-row:last-child{border-bottom:none;}
.legend-dot{width:12px; height:12px; border-radius:50%; flex-shrink:0;}
.legend-nm{flex:1; font-weight:600; color:var(--pearl);}
.legend-amt{color:var(--tea2); font-size:13px;}
.stat-summary{
  background:var(--bg); border:1px solid var(--line); border-radius:14px;
  padding:4px 14px; margin-top:10px;
}
.srow{
  display:flex; justify-content:space-between; align-items:center;
  padding:11px 0; border-bottom:1px dashed var(--line); font-size:14px;
}
.srow:last-child{border-bottom:none;}
.srow .sk{color:var(--tea2);}
.srow .sv{font-weight:700; color:var(--tea); font-size:15px;}
</style>
</head>
<body>

<!-- ══ CALENDAR PAGE ══ -->
<div class="page active" id="page-cal">
  <div class="pg-header">手搖日記</div>
  <div class="cal-wrap">
    <div class="cal-nav-row">
      <button class="cal-arrow" id="calPrev">‹</button>
      <div class="cal-month-lbl" id="calLabel"></div>
      <button class="cal-arrow" id="calNext">›</button>
    </div>
    <div class="cal-wd-row">
      <div class="cal-wd">週日</div><div class="cal-wd">週一</div><div class="cal-wd">週二</div>
      <div class="cal-wd">週三</div><div class="cal-wd">週四</div><div class="cal-wd">週五</div><div class="cal-wd">週六</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="month-box">
      <div class="mb-lbl" id="calMonthLbl">本月總飲料花費</div>
      <div class="mb-num" id="calMonthTotal">$0</div>
    </div>
  </div>
  <div class="day-section" id="daySection" style="display:none;">
    <div class="day-title" id="dayTitle"></div>
    <div class="day-card" id="dayCard"></div>
  </div>
</div>

<!-- ══ ADD / EDIT PAGE ══ -->
<div class="page" id="page-add">
  <div class="pg-header" id="addPageTitle">新增紀錄</div>
  <div class="form-page-wrap">
    <div class="form-field">
      <span class="fi">📅</span>
      <input type="date" id="f_date">
    </div>
    <div class="form-field">
      <span class="fi">🏪</span>
      <input type="text" id="f_shop" placeholder="店名">
    </div>
    <div class="form-field">
      <span class="fi">🧋</span>
      <input type="text" id="f_item" placeholder="品項">
    </div>
    <div class="form-field">
      <span class="fi">💰</span>
      <input type="number" id="f_price" placeholder="金額" inputmode="numeric">
    </div>
    <div class="form-field">
      <span class="fi">📝</span>
      <textarea id="f_note" placeholder="評語"></textarea>
    </div>

    <div class="form-section-lbl">評價</div>
    <div class="star-row" id="starRow"></div>

    <div class="form-section-lbl">冰塊</div>
    <div class="chip-group" id="iceChips"></div>

    <div class="form-section-lbl">甜度</div>
    <div class="chip-group" id="sugarChips"></div>

    <div class="action-row">
      <button class="btn btn-secondary" id="btnCancel">取消</button>
      <button class="btn btn-primary" id="btnSave">儲存</button>
    </div>
    <button class="btn btn-danger" id="btnDelete" style="display:none;">刪除這筆紀錄</button>
    <div class="del-confirm" id="delConfirm">
      <p>確定要刪除嗎？</p>
      <div class="action-row">
        <button class="btn btn-secondary" id="btnDelNo">取消</button>
        <button class="btn btn-danger" id="btnDelYes" style="margin-top:0;flex:1;">確定刪除</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ STATS PAGE ══ -->
<div class="page" id="page-stats">
  <div class="pg-header">統計分析</div>
  <div class="stats-wrap">
    <div class="seg-ctrl">
      <button class="seg-btn active" data-mode="month">本月累計</button>
      <button class="seg-btn" data-mode="year">全年累積</button>
    </div>
    <div class="stat-nav">
      <button id="statPrev">‹</button>
      <div class="stat-lbl" id="statLabel"></div>
      <button id="statNext">›</button>
    </div>
    <div class="pie-wrap">
      <canvas id="pieChart" width="220" height="220"></canvas>
    </div>
    <div class="legend-list" id="legend"></div>
    <div class="stat-summary" id="statSummary"></div>
  </div>
</div>

<!-- ══ BOTTOM NAV ══ -->
<nav class="bottom-nav">
  <div class="nav-item active" data-nav="cal">
    <div class="nav-icon">📅</div>
    <div class="nav-lbl">手搖日記</div>
  </div>
  <div class="nav-add" data-nav="add">
    <div class="nav-add-circle" id="navAddCircle">＋</div>
    <div class="nav-lbl">新增紀錄</div>
  </div>
  <div class="nav-item" data-nav="stats">
    <div class="nav-icon">📊</div>
    <div class="nav-lbl">統計分析</div>
  </div>
</nav>

<script>
const ICE   = ["正常","少冰","微冰","去冰","常溫","溫","熱"];
const SUGAR = ["全糖","少糖","半糖","微糖","一分糖","無糖","固定"];
const KEY   = "drinkLogRecords_v1";
const PAL   = ["#C9881F","#D9502A","#B5742A","#7B3FA0","#2A7BC9","#3DAA6A","#E8A95E","#C94A75","#6B4226","#2AA8A0"];

let records = JSON.parse(localStorage.getItem(KEY)||"[]");
let editingId = null;
let calYear, calMonth, today, selectedDay=null;
let statMode="month", statYear, statMonth;
const shopColors={};
let curNav="cal";

function colorForShop(n){
  if(!shopColors[n]){
    const t=Object.values(shopColors);
    shopColors[n]=PAL.find(c=>!t.includes(c))||PAL[Object.keys(shopColors).length%PAL.length];
  }
  return shopColors[n];
}
function save(){ localStorage.setItem(KEY,JSON.stringify(records)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(n){ return "$"+Number(n||0).toLocaleString(); }
function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── nav ── */
let curIce=ICE[0], curSugar=SUGAR[0], curStars=0;

function switchPage(name){
  curNav=name;
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("page-"+name).classList.add("active");
  document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
  const ni=document.querySelector(`.nav-item[data-nav="${name}"]`);
  if(ni) ni.classList.add("active");
  const ac=document.getElementById("navAddCircle");
  ac.classList.toggle("active-add", name==="add");
  if(name==="cal") renderCalendar();
  if(name==="stats") renderStats();
}
document.querySelectorAll(".nav-item[data-nav], .nav-add[data-nav]").forEach(el=>{
  el.addEventListener("click",()=>{
    const n=el.dataset.nav;
    if(n==="add") openAdd(null);
    else switchPage(n);
  });
});

/* ── chips & stars ── */
function buildChips(el, opts, onPick, getSel){
  el.innerHTML="";
  opts.forEach(o=>{
    const c=document.createElement("div");
    c.className="chip"+(getSel()===o?" sel":"");
    c.textContent=o;
    c.onclick=()=>{onPick(o); refreshChips();};
    el.appendChild(c);
  });
}
function refreshChips(){
  buildChips(document.getElementById("iceChips"),  ICE,  v=>curIce=v,  ()=>curIce);
  buildChips(document.getElementById("sugarChips"),SUGAR,v=>curSugar=v,()=>curSugar);
  renderStars();
}
function renderStars(){
  const row=document.getElementById("starRow"); row.innerHTML="";
  for(let i=1;i<=5;i++){
    const s=document.createElement("span");
    s.className="star-btn"+(i<=curStars?" on":""); s.textContent="★";
    s.onclick=()=>{curStars=(curStars===i?i-1:i); renderStars();};
    row.appendChild(s);
  }
}

/* ── add/edit form ── */
function openAdd(record){
  editingId=record?record.id:null;
  document.getElementById("addPageTitle").textContent=record?"編輯紀錄":"新增紀錄";
  document.getElementById("f_date").value =record?record.date:new Date().toISOString().slice(0,10);
  document.getElementById("f_shop").value =record?record.shop:"";
  document.getElementById("f_item").value =record?record.item:"";
  document.getElementById("f_price").value=record?record.price:"";
  document.getElementById("f_note").value =record?record.note:"";
  curIce=record?record.ice:ICE[0];
  curSugar=record?record.sugar:SUGAR[0];
  curStars=record?record.stars:0;
  refreshChips();
  document.getElementById("btnDelete").style.display=record?"block":"none";
  document.getElementById("delConfirm").classList.remove("show");
  switchPage("add");
  window.scrollTo(0,0);
}
function closeAdd(){
  const prev = (curNav==="add") ? "cal" : curNav;
  switchPage("cal");
}

document.getElementById("btnCancel").onclick=closeAdd;
document.getElementById("btnSave").onclick=()=>{
  const shop =document.getElementById("f_shop").value.trim();
  const item =document.getElementById("f_item").value.trim();
  const price=parseFloat(document.getElementById("f_price").value)||0;
  const date =document.getElementById("f_date").value||new Date().toISOString().slice(0,10);
  const note =document.getElementById("f_note").value.trim();
  if(!shop){alert("請輸入店名");return;}
  colorForShop(shop);
  if(editingId){
    const r=records.find(x=>x.id===editingId);
    Object.assign(r,{shop,item,price,date,note,ice:curIce,sugar:curSugar,stars:curStars});
  } else {
    records.push({id:uid(),shop,item,price,date,note,ice:curIce,sugar:curSugar,stars:curStars});
  }
  save(); closeAdd(); renderCalendar(); renderStats();
};
document.getElementById("btnDelete").onclick=()=>{
  document.getElementById("delConfirm").classList.add("show");
};
document.getElementById("btnDelNo").onclick=()=>{
  document.getElementById("delConfirm").classList.remove("show");
};
document.getElementById("btnDelYes").onclick=()=>{
  records=records.filter(r=>r.id!==editingId);
  save(); closeAdd(); renderCalendar(); renderStats();
};

/* ── record item builder ── */
function makeRecItem(r, showDate){
  colorForShop(r.shop);
  const div=document.createElement("div"); div.className="rec-item";
  const stars="★".repeat(r.stars||0)+"☆".repeat(5-(r.stars||0));
  const dateStr=showDate? r.date.slice(5).replace("-","/")+` - ` : "";
  div.innerHTML=`
    <div class="rec-bar" style="background:${shopColors[r.shop]}"></div>
    <div class="rec-body">
      <div class="rec-row1">
        <div><span class="rec-shop">${esc(r.shop)}</span><span class="rec-stars">${stars}</span></div>
        <div class="rec-price">${fmt(r.price)}</div>
      </div>
      ${(r.item||showDate)?`<div class="rec-row2">${dateStr}${esc(r.item||"")}</div>`:""}
      <div class="rec-tags">
        ${r.ice?`<span class="rec-tag">${r.ice}</span>`:""}
        ${r.sugar?`<span class="rec-tag">${r.sugar}</span>`:""}
      </div>
      ${r.note?`<div class="rec-note-txt">「${esc(r.note)}」</div>`:""}
    </div>`;
  return div;
}

/* ── calendar ── */
function initCal(){
  const n=new Date(); calYear=n.getFullYear(); calMonth=n.getMonth();
  today=n.toISOString().slice(0,10);
}
document.getElementById("calPrev").onclick=()=>{
  calMonth--; if(calMonth<0){calMonth=11;calYear--;} selectedDay=null; renderCalendar();
};
document.getElementById("calNext").onclick=()=>{
  calMonth++; if(calMonth>11){calMonth=0;calYear++;} selectedDay=null; renderCalendar();
};

function renderCalendar(){
  document.getElementById("calLabel").textContent=`${calYear}年${calMonth+1}月`;
  document.getElementById("calMonthLbl").textContent=`${calMonth+1}月總飲料花費`;
  const grid=document.getElementById("calGrid"); grid.innerHTML="";
  const startDow=new Date(calYear,calMonth,1).getDay();
  const dim=new Date(calYear,calMonth+1,0).getDate();
  const prevDim=new Date(calYear,calMonth,0).getDate();
  const byDay={};let tot=0;
  records.forEach(r=>{
    const d=new Date(r.date);
    if(d.getFullYear()===calYear&&d.getMonth()===calMonth){
      byDay[r.date]=byDay[r.date]||[]; byDay[r.date].push(r);
      tot+=Number(r.price)||0;
    }
  });
  document.getElementById("calMonthTotal").textContent=fmt(tot);
  // prev month ghost
  for(let i=0;i<startDow;i++){
    const c=document.createElement("div"); c.className="cal-cell other-month";
    c.textContent=prevDim-startDow+1+i; grid.appendChild(c);
  }
  for(let d=1;d<=dim;d++){
    const key=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=byDay[key];
    const cell=document.createElement("div");
    let cls="cal-cell"+(has?" has":"")+(key===today?" today":"")+(key===selectedDay?" sel":"");
    cell.className=cls; cell.textContent=d;
    if(has){ const dot=document.createElement("div"); dot.className="cal-dot"; cell.appendChild(dot); }
    cell.onclick=()=>{ selectedDay=(selectedDay===key?null:key); renderCalendar(); renderDayDetail(); };
    grid.appendChild(cell);
  }
  // next month ghost
  const total=startDow+dim; const rem=total%7===0?0:7-(total%7);
  for(let i=1;i<=rem;i++){
    const c=document.createElement("div"); c.className="cal-cell other-month";
    c.textContent=i; grid.appendChild(c);
  }
  renderDayDetail();
}
function renderDayDetail(){
  const list=records.filter(r=>r.date===selectedDay);
  const sec=document.getElementById("daySection");
  const card=document.getElementById("dayCard");
  if(!selectedDay||!list.length){ sec.style.display="none"; return; }
  sec.style.display="block";
  document.getElementById("dayTitle").textContent=
    `${selectedDay.slice(5).replace("-","/")} 的紀錄`;
  card.innerHTML="";
  list.forEach(r=>{
    const el=makeRecItem(r,false);
    el.onclick=()=>openAdd(r);
    card.appendChild(el);
  });
}

/* ── stats ── */
function initStats(){ const n=new Date(); statYear=n.getFullYear(); statMonth=n.getMonth(); }
document.querySelectorAll(".seg-btn").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".seg-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); statMode=b.dataset.mode; renderStats();
  };
});
document.getElementById("statPrev").onclick=()=>{
  statMode==="month"?(--statMonth<0&&(statMonth=11,statYear--)):statYear--; renderStats();
};
document.getElementById("statNext").onclick=()=>{
  statMode==="month"?(++statMonth>11&&(statMonth=0,statYear++)):statYear++; renderStats();
};

function renderStats(){
  document.getElementById("statLabel").textContent=
    statMode==="month"?`${statYear} 年 ${statMonth+1} 月`:`${statYear} 年`;
  const filtered=records.filter(r=>{
    const d=new Date(r.date);
    return statMode==="month"
      ?(d.getFullYear()===statYear&&d.getMonth()===statMonth)
      :d.getFullYear()===statYear;
  });
  const byShop={}; let total=0; let cups=filtered.length;
  filtered.forEach(r=>{
    colorForShop(r.shop);
    byShop[r.shop]=(byShop[r.shop]||0)+(Number(r.price)||0);
    total+=Number(r.price)||0;
  });
  const entries=Object.entries(byShop).sort((a,b)=>b[1]-a[1]);
  drawPie(entries, total, cups);
  const legend=document.getElementById("legend"); legend.innerHTML="";
  if(!entries.length){
    legend.innerHTML='<div class="empty-state">這段期間還沒有紀錄</div>';
  }
  entries.forEach(([shop,amt])=>{
    const pct=total?((amt/total)*100).toFixed(0):0;
    const row=document.createElement("div"); row.className="legend-row";
    row.innerHTML=`<div class="legend-dot" style="background:${shopColors[shop]}"></div>
      <div class="legend-nm">${esc(shop)}</div>
      <div class="legend-amt">${fmt(amt)} (${pct}%)</div>`;
    legend.appendChild(row);
  });
  const avgP=cups?Math.round(total/cups):0;
  const avgS=cups?(filtered.reduce((s,r)=>s+(r.stars||0),0)/cups).toFixed(1):0;
  const topShop=entries.length?entries[0][0]:"—";
  const sc={},ic={};
  filtered.forEach(r=>{ sc[r.sugar]=(sc[r.sugar]||0)+1; ic[r.ice]=(ic[r.ice]||0)+1; });
  const fs=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];
  const fi=Object.entries(ic).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById("statSummary").innerHTML=`
    <div class="srow"><div class="sk">總消費</div><div class="sv">${fmt(total)}</div></div>
    <div class="srow"><div class="sk">杯數</div><div class="sv">${cups} 杯</div></div>
    <div class="srow"><div class="sk">平均單價</div><div class="sv">${fmt(avgP)}</div></div>
    <div class="srow"><div class="sk">平均評價</div><div class="sv">${avgS} ★</div></div>
    <div class="srow"><div class="sk">最常光顧</div><div class="sv">${esc(topShop)}</div></div>
    <div class="srow"><div class="sk">偏好甜度</div><div class="sv">${fs?fs[0]:"—"}</div></div>
    <div class="srow"><div class="sk">偏好冰塊</div><div class="sv">${fi?fi[0]:"—"}</div></div>`;
}

function drawPie(entries, total, cups){
  const canvas=document.getElementById("pieChart");
  const dpr=window.devicePixelRatio||1;
  const size=220;
  canvas.style.width=size+"px"; canvas.style.height=size+"px";
  canvas.width=size*dpr; canvas.height=size*dpr;
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  const cx=size/2, cy=size/2, r=size/2-10;
  ctx.clearRect(0,0,size,size);
  if(!total||!entries.length){
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle="#F0E6C0"; ctx.fill();
    ctx.fillStyle="#9C6B3E"; ctx.font="13px PingFang TC,sans-serif";
    ctx.textAlign="center"; ctx.fillText("尚無資料",cx,cy+5); return;
  }
  let start=-Math.PI/2;
  entries.forEach(([shop,amt])=>{
    const slice=(amt/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,start+slice); ctx.closePath();
    ctx.fillStyle=shopColors[shop]; ctx.fill();
    start+=slice;
  });
  ctx.beginPath(); ctx.arc(cx,cy,r*.55,0,Math.PI*2);
  ctx.fillStyle="#FFFDF5"; ctx.fill();
  // center text: 本月累積 / 杯數
  const modeLabel = statMode==="month"?"本月累積":"本年累積";
  ctx.fillStyle="#9C6B3E"; ctx.font=`500 13px PingFang TC,sans-serif`;
  ctx.textAlign="center"; ctx.fillText(modeLabel,cx,cy-8);
  ctx.fillStyle="#D9A441"; ctx.font=`bold 22px PingFang TC,sans-serif`;
  ctx.fillText(`${cups} 杯`,cx,cy+16);
}

/* init */
initCal(); initStats(); refreshChips(); renderCalendar(); renderStats();
</script>
