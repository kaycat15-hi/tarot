<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>手搖紀錄</title>
<style>
:root{
  --c1:#FFFDF5; --c2:#FFF3C4; --c3:#FFE082; --c4:#F4C95D; --c5:#D9A441;
  --tea:#6B4226; --tea-light:#9C6B3E; --line:#F0DDA0;
  --pearl:#3E2B1F; --danger:#D97B66;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0; font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:linear-gradient(160deg,var(--c1) 0%,var(--c2) 45%,var(--c3) 100%);
  background-attachment:fixed;
  color:var(--pearl); min-height:100vh; padding-bottom:28px;
}

/* ── header ── */
header{padding:16px 16px 8px; text-align:center;}
header h1{margin:0; font-size:19px; letter-spacing:2px; color:var(--tea);}
header .sub{font-size:11px; color:var(--tea-light); margin-top:2px;}

/* ── tabs sticky ── */
.tabs{
  position:sticky; top:0; z-index:20;
  display:flex; gap:5px; padding:6px 12px;
  background:rgba(255,248,220,.95); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.tab{
  flex:1; text-align:center; padding:8px 2px; border-radius:10px;
  background:rgba(255,255,255,.5); color:var(--tea-light); font-size:13px;
  border:1px solid var(--line); cursor:pointer; transition:.15s;
}
.tab.active{
  background:linear-gradient(135deg,var(--c4),var(--c5));
  color:#fff; font-weight:700; box-shadow:0 2px 6px rgba(217,164,65,.4);
}

/* ── pages ── */
.page{display:none; padding:10px 12px 0;}
.page.active{display:block;}

/* ── card ── */
.card{
  background:rgba(255,255,255,.78); border:1px solid var(--line);
  border-radius:14px; padding:12px; margin-bottom:10px;
}

/* ── form ── */
.field{margin-bottom:9px;}
.field label{display:block; font-size:11px; color:var(--tea-light); margin-bottom:3px; font-weight:700; letter-spacing:.3px;}
.field input[type=text],
.field input[type=number],
.field textarea,
.field input[type=date]{
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:9px;
  background:#fffefa; font-size:13.5px; color:var(--pearl); font-family:inherit; outline:none;
}
.field input:focus,.field textarea:focus{border-color:var(--c4);}
.field textarea{resize:vertical; min-height:44px;}
.chiprow{display:flex; flex-wrap:wrap; gap:4px;}
.chip{
  padding:5px 10px; border-radius:999px; border:1px solid var(--line); background:#fffefa;
  font-size:11.5px; color:var(--tea-light); cursor:pointer; user-select:none;
}
.chip.sel{background:linear-gradient(135deg,var(--c4),var(--c5)); color:#fff; border-color:var(--c5); font-weight:700;}
.stars{font-size:26px; letter-spacing:4px; cursor:pointer; line-height:1.2;}
.star{color:#e0d5b5;}
.star.on{color:#E8A23D;}
.btn{
  width:100%; padding:11px; border:none; border-radius:10px; font-size:13.5px; font-weight:700;
  background:linear-gradient(135deg,var(--c4),var(--c5)); color:#fff; cursor:pointer;
}
.btn.secondary{background:#fff; color:var(--tea-light); border:1px solid var(--line); font-weight:600;}
.btn.danger{background:var(--danger); color:#fff;}
.row2{display:flex; gap:8px;}

/* add-btn */
.add-btn{
  width:100%; padding:11px; border:none; border-radius:12px; font-size:13.5px; font-weight:700;
  background:linear-gradient(135deg,var(--c4),var(--c5)); color:#fff; cursor:pointer;
  margin-bottom:10px;
}

/* form panel – expands in-flow */
.form-panel{display:none; margin-bottom:10px;}
.form-panel.open{display:block;}

/* custom confirm bar */
.del-confirm{
  display:none; background:#fff3f0; border:1px solid #f5c0b0;
  border-radius:10px; padding:10px 12px; margin-top:8px; text-align:center;
}
.del-confirm.show{display:block;}
.del-confirm p{margin:0 0 8px; font-size:12.5px; color:var(--danger); font-weight:600;}
.del-confirm .row2{margin:0;}

/* ── list records – compact ── */
.record{
  display:flex; gap:8px; padding:7px 1px; border-bottom:1px solid var(--line); cursor:pointer;
}
.record:last-child{border-bottom:none;}
.rec-dot{width:4px; border-radius:3px; flex-shrink:0; align-self:stretch; min-height:14px;}
.rec-info{flex:1; min-width:0;}
.rec-top{display:flex; justify-content:space-between; align-items:baseline; gap:6px;}
.rec-shop{font-weight:700; font-size:13.5px; color:var(--tea); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rec-price{font-weight:700; color:var(--c5); font-size:13px; flex-shrink:0;}
.rec-item{font-size:12px; color:var(--tea-light); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rec-meta{font-size:10.5px; color:#a08a5e; margin-top:2px;}
.rec-stars{font-size:11px; color:#E8A23D; display:inline;}
.rec-note{font-size:11px; color:#8a7654; margin-top:2px; font-style:italic;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rec-date{font-size:10px; color:#b5a778; margin-top:1px;}
.empty{text-align:center; color:var(--tea-light); padding:28px 10px; font-size:12.5px;}

/* ── calendar – NO sticky, fixed layout ── */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:7px;}
.cal-nav{background:none; border:none; font-size:20px; color:var(--tea); cursor:pointer; padding:2px 8px; line-height:1;}
.cal-lbl{font-weight:700; color:var(--tea); font-size:14px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center;}
.cal-wd{font-size:10px; color:var(--tea-light); padding-bottom:3px;}
.cal-cell{
  height:34px; border-radius:7px; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  font-size:11px; color:var(--pearl); background:rgba(255,255,255,.4); cursor:pointer;
}
.cal-cell.empty{background:none; cursor:default;}
.cal-cell.has{background:linear-gradient(135deg,#FFE9A8,var(--c4)); font-weight:700;}
.cal-cell .camt{font-size:7.5px; color:rgba(62,43,31,.6); line-height:1.1; margin-top:0;}
.cal-cell.today{outline:2px solid var(--c5); outline-offset:-1px;}
.cal-cell.sel{outline:2px solid var(--tea); outline-offset:-1px;}
.month-total{
  text-align:center; padding:9px; border-radius:10px; margin-top:8px;
  background:linear-gradient(135deg,var(--c4),var(--c5)); color:#fff;
}
.month-total .mnum{font-size:20px; font-weight:800;}
.month-total .mlbl{font-size:10.5px; opacity:.85;}
.day-title{font-weight:700; color:var(--tea); font-size:12.5px; margin-bottom:6px;}

/* ── stats ── */
.stat-mode-row{display:flex; gap:6px; margin-bottom:8px;}
.stat-mode-row button{
  flex:1; padding:7px; border-radius:9px; border:1px solid var(--line); background:#fffefa;
  color:var(--tea-light); font-size:12.5px; cursor:pointer;
}
.stat-mode-row button.active{
  background:linear-gradient(135deg,var(--c4),var(--c5)); color:#fff; border-color:var(--c5); font-weight:700;
}
.stat-nav-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.stat-nav-row button{
  background:none; border:1px solid var(--line); border-radius:9px;
  font-size:14px; color:var(--tea-light); cursor:pointer; padding:6px 14px;
}
.stat-lbl{font-weight:700; color:var(--tea); font-size:14px; flex:1; text-align:center;}
.legend-row{display:flex; align-items:center; gap:7px; padding:5px 0; font-size:12.5px; border-bottom:1px solid var(--line);}
.legend-row:last-child{border-bottom:none;}
.legend-sw{width:10px; height:10px; border-radius:2px; flex-shrink:0;}
.legend-nm{flex:1; color:var(--pearl);}
.legend-vl{color:var(--tea-light); font-size:11px; white-space:nowrap;}
.stat-box{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--line); font-size:12.5px;}
.stat-box:last-child{border-bottom:none;}
.stat-box .k{color:var(--tea-light);}
.stat-box .v{font-weight:700; color:var(--tea);}
</style>
</head>
<body>

<header>
  <h1>🧋 手搖紀錄</h1>
  <div class="sub">記錄每一杯的甜蜜時光</div>
</header>

<div class="tabs">
  <div class="tab active" data-page="list">紀錄</div>
  <div class="tab" data-page="cal">月曆</div>
  <div class="tab" data-page="stats">統計</div>
</div>

<!-- ══ LIST ══ -->
<div class="page active" id="page-list">

  <button class="add-btn" id="addBtn">＋ 新增一筆紀錄</button>

  <div class="form-panel card" id="formPanel">
    <div style="font-weight:700;color:var(--tea);font-size:14px;margin-bottom:10px;" id="formTitle">新增紀錄</div>
    <div class="field"><label>日期</label><input type="date" id="f_date"></div>
    <div class="field"><label>店名</label><input type="text" id="f_shop" placeholder="例如：50嵐"></div>
    <div class="field"><label>品名</label><input type="text" id="f_item" placeholder="例如：四季春青茶"></div>
    <div class="field"><label>金額</label><input type="number" id="f_price" placeholder="0" inputmode="numeric"></div>
    <div class="field"><label>冰塊</label><div class="chiprow" id="iceChips"></div></div>
    <div class="field"><label>甜度</label><div class="chiprow" id="sugarChips"></div></div>
    <div class="field"><label>評價</label><div class="stars" id="starRow"></div></div>
    <div class="field"><label>評語</label><textarea id="f_note" placeholder="這杯喝起來如何呢？"></textarea></div>
    <div class="row2">
      <button class="btn secondary" id="btnCancel">取消</button>
      <button class="btn" id="btnSave">儲存</button>
    </div>
    <!-- 刪除按鈕 + 自訂確認列（不用 confirm()） -->
    <button class="btn danger" id="btnDelete" style="display:none;margin-top:8px;">刪除這筆紀錄</button>
    <div class="del-confirm" id="delConfirm">
      <p>確定要刪除這筆紀錄嗎？</p>
      <div class="row2">
        <button class="btn secondary" id="btnDelNo">取消</button>
        <button class="btn danger" id="btnDelYes">確定刪除</button>
      </div>
    </div>
  </div>

  <div class="card" id="listCard">
    <div class="empty">尚無紀錄，點上方按鈕新增第一筆吧！</div>
  </div>
</div>

<!-- ══ CALENDAR ══ -->
<div class="page" id="page-cal">
  <div class="card">
    <div class="cal-head">
      <button class="cal-nav" id="calPrev">‹</button>
      <div class="cal-lbl" id="calLabel"></div>
      <button class="cal-nav" id="calNext">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="month-total">
      <div class="mnum" id="calMonthTotal">$0</div>
      <div class="mlbl">本月消費總額</div>
    </div>
  </div>
  <div class="card" id="calDayCard" style="display:none;">
    <div id="calDayList"></div>
  </div>
</div>

<!-- ══ STATS ══ -->
<div class="page" id="page-stats">
  <div class="stat-mode-row">
    <button class="active" data-mode="month">月份</button>
    <button data-mode="year">年度</button>
  </div>
  <div class="stat-nav-row">
    <button id="statPrev">‹</button>
    <div class="stat-lbl" id="statLabel"></div>
    <button id="statNext">›</button>
  </div>
  <div class="card">
    <canvas id="pieChart" style="display:block;margin:0 auto;"></canvas>
    <div id="legend" style="margin-top:10px;"></div>
  </div>
  <div class="card" id="statSummary"></div>
</div>

<script>
const ICE   = ["正常","少冰","微冰","去冰","常溫","溫","熱"];
const SUGAR = ["全糖","少糖","半糖","微糖","一分糖","無糖","固定"];
const STORE_KEY = "drinkLogRecords_v1";
const PALETTE = ["#C9881F","#D9A441","#B5742A","#E8A95E","#8C6230",
                 "#E8C16C","#A66A1E","#DCC07A","#6B4226","#F0DDA0"];

let records = JSON.parse(localStorage.getItem(STORE_KEY)||"[]");
let editingId = null;
let calYear, calMonth, today, selectedDayKey=null;
let statMode="month", statYear, statMonth;
const shopColors={};

function colorForShop(name){
  if(!shopColors[name]){
    const taken=Object.values(shopColors);
    shopColors[name]=PALETTE.find(c=>!taken.includes(c))||PALETTE[Object.keys(shopColors).length%PALETTE.length];
  }
  return shopColors[name];
}
function save(){ localStorage.setItem(STORE_KEY,JSON.stringify(records)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(n){ return "$"+Number(n||0).toLocaleString(); }
function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* tabs */
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("page-"+t.dataset.page).classList.add("active");
    if(t.dataset.page==="cal") renderCalendar();
    if(t.dataset.page==="stats") renderStats();
  };
});

/* chips */
let curIce=ICE[0],curSugar=SUGAR[0],curStars=0;
function buildChips(el,opts,onPick,getSel){
  el.innerHTML="";
  opts.forEach(o=>{
    const c=document.createElement("div");
    c.className="chip"+(getSel()===o?" sel":"");
    c.textContent=o;
    c.onclick=()=>{onPick(o);refreshChips();};
    el.appendChild(c);
  });
}
function refreshChips(){
  buildChips(document.getElementById("iceChips"),  ICE,  v=>curIce=v,  ()=>curIce);
  buildChips(document.getElementById("sugarChips"),SUGAR,v=>curSugar=v,()=>curSugar);
  renderStars();
}
function renderStars(){
  const row=document.getElementById("starRow"); row.innerHTML="";
  for(let i=1;i<=5;i++){
    const s=document.createElement("span");
    s.className="star"+(i<=curStars?" on":""); s.textContent="★";
    s.onclick=()=>{curStars=(curStars===i?i-1:i);renderStars();};
    row.appendChild(s);
  }
}

/* form */
const formPanel=document.getElementById("formPanel");
const addBtn=document.getElementById("addBtn");
const delConfirm=document.getElementById("delConfirm");

function openForm(record){
  editingId=record?record.id:null;
  document.getElementById("formTitle").textContent=record?"編輯紀錄":"新增紀錄";
  document.getElementById("f_date").value =record?record.date:new Date().toISOString().slice(0,10);
  document.getElementById("f_shop").value =record?record.shop:"";
  document.getElementById("f_item").value =record?record.item:"";
  document.getElementById("f_price").value=record?record.price:"";
  document.getElementById("f_note").value =record?record.note:"";
  curIce=record?record.ice:ICE[0];
  curSugar=record?record.sugar:SUGAR[0];
  curStars=record?record.stars:0;
  refreshChips();
  document.getElementById("btnDelete").style.display=record?"block":"none";
  delConfirm.classList.remove("show");
  formPanel.classList.add("open");
  addBtn.style.display="none";
  formPanel.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function closeForm(){
  formPanel.classList.remove("open");
  delConfirm.classList.remove("show");
  addBtn.style.display="";
}

addBtn.onclick=()=>openForm(null);
document.getElementById("btnCancel").onclick=closeForm;

document.getElementById("btnSave").onclick=()=>{
  const shop =document.getElementById("f_shop").value.trim();
  const item =document.getElementById("f_item").value.trim();
  const price=parseFloat(document.getElementById("f_price").value)||0;
  const date =document.getElementById("f_date").value||new Date().toISOString().slice(0,10);
  const note =document.getElementById("f_note").value.trim();
  if(!shop){alert("請輸入店名");return;}
  colorForShop(shop);
  if(editingId){
    const r=records.find(x=>x.id===editingId);
    Object.assign(r,{shop,item,price,date,note,ice:curIce,sugar:curSugar,stars:curStars});
  } else {
    records.push({id:uid(),shop,item,price,date,note,ice:curIce,sugar:curSugar,stars:curStars});
  }
  save(); closeForm(); renderList(); renderCalendar(); renderStats();
};

/* 刪除：自訂確認，不用 confirm() */
document.getElementById("btnDelete").onclick=()=>{
  delConfirm.classList.add("show");
};
document.getElementById("btnDelNo").onclick=()=>{
  delConfirm.classList.remove("show");
};
document.getElementById("btnDelYes").onclick=()=>{
  records=records.filter(r=>r.id!==editingId);
  save(); closeForm(); renderList(); renderCalendar(); renderStats();
};

/* list */
function makeRecord(r, showDate){
  colorForShop(r.shop);
  const div=document.createElement("div"); div.className="record";
  div.innerHTML=`
    <div class="rec-dot" style="background:${shopColors[r.shop]}"></div>
    <div class="rec-info">
      <div class="rec-top">
        <div class="rec-shop">${esc(r.shop)}</div>
        <div class="rec-price">${fmt(r.price)}</div>
      </div>
      ${r.item?`<div class="rec-item">${esc(r.item)}</div>`:""}
      <div class="rec-meta">🧊${r.ice} ・ 🍯${r.sugar} &nbsp;<span class="rec-stars">${"★".repeat(r.stars||0)}${"☆".repeat(5-(r.stars||0))}</span></div>
      ${r.note?`<div class="rec-note">「${esc(r.note)}」</div>`:""}
      ${showDate?`<div class="rec-date">${r.date}</div>`:""}
    </div>`;
  return div;
}

function renderList(){
  const card=document.getElementById("listCard");
  if(!records.length){ card.innerHTML='<div class="empty">尚無紀錄，點上方按鈕新增第一筆吧！</div>'; return; }
  card.innerHTML="";
  [...records].sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{
    const div=makeRecord(r,true);
    div.onclick=()=>openForm(r);
    card.appendChild(div);
  });
}

/* calendar */
function initCal(){
  const n=new Date(); calYear=n.getFullYear(); calMonth=n.getMonth();
  today=n.toISOString().slice(0,10);
}
document.getElementById("calPrev").onclick=()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();};
document.getElementById("calNext").onclick=()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();};

function renderCalendar(){
  document.getElementById("calLabel").textContent=`${calYear} 年 ${calMonth+1} 月`;
  const grid=document.getElementById("calGrid"); grid.innerHTML="";
  ["日","一","二","三","四","五","六"].forEach(w=>{
    const d=document.createElement("div"); d.className="cal-wd"; d.textContent=w; grid.appendChild(d);
  });
  const startDow=new Date(calYear,calMonth,1).getDay();
  const dim=new Date(calYear,calMonth+1,0).getDate();
  const byDay={};let tot=0;
  records.forEach(r=>{
    const d=new Date(r.date);
    if(d.getFullYear()===calYear&&d.getMonth()===calMonth){
      byDay[r.date]=byDay[r.date]||[]; byDay[r.date].push(r);
      tot+=Number(r.price)||0;
    }
  });
  document.getElementById("calMonthTotal").textContent=fmt(tot);
  for(let i=0;i<startDow;i++){
    const c=document.createElement("div"); c.className="cal-cell empty"; grid.appendChild(c);
  }
  for(let d=1;d<=dim;d++){
    const key=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=byDay[key];
    const cell=document.createElement("div");
    cell.className="cal-cell"+(has?" has":"")+(key===today?" today":"")+(key===selectedDayKey?" sel":"");
    let s=0; if(has) has.forEach(r=>s+=Number(r.price)||0);
    cell.innerHTML=`<div>${d}</div>`+(has?`<div class="camt">${s}</div>`:"");
    cell.onclick=()=>{ selectedDayKey=(selectedDayKey===key?null:key); renderCalendar(); renderDayDetail(); };
    grid.appendChild(cell);
  }
  renderDayDetail();
}
function renderDayDetail(){
  const list=records.filter(r=>r.date===selectedDayKey);
  const card=document.getElementById("calDayCard");
  const box=document.getElementById("calDayList");
  if(!selectedDayKey||!list.length){ card.style.display="none"; return; }
  card.style.display="block"; box.innerHTML=`<div class="day-title">${selectedDayKey}</div>`;
  list.forEach(r=>{
    const div=makeRecord(r,false);
    div.onclick=()=>{
      document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
      document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
      document.querySelector('[data-page="list"]').classList.add("active");
      document.getElementById("page-list").classList.add("active");
      openForm(r);
    };
    box.appendChild(div);
  });
}

/* stats */
function initStats(){ const n=new Date(); statYear=n.getFullYear(); statMonth=n.getMonth(); }
document.querySelectorAll(".stat-mode-row button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".stat-mode-row button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); statMode=b.dataset.mode; renderStats();
  };
});
document.getElementById("statPrev").onclick=()=>{
  statMode==="month"?(--statMonth<0&&(statMonth=11,statYear--)):statYear--;renderStats();
};
document.getElementById("statNext").onclick=()=>{
  statMode==="month"?(++statMonth>11&&(statMonth=0,statYear++)):statYear++;renderStats();
};

function renderStats(){
  document.getElementById("statLabel").textContent=
    statMode==="month"?`${statYear} 年 ${statMonth+1} 月`:`${statYear} 年`;
  const filtered=records.filter(r=>{
    const d=new Date(r.date);
    return statMode==="month"
      ?(d.getFullYear()===statYear&&d.getMonth()===statMonth)
      :d.getFullYear()===statYear;
  });
  const byShop={}; let total=0;
  filtered.forEach(r=>{colorForShop(r.shop); byShop[r.shop]=(byShop[r.shop]||0)+(Number(r.price)||0); total+=Number(r.price)||0;});
  const entries=Object.entries(byShop).sort((a,b)=>b[1]-a[1]);
  drawPie(entries,total);
  const legend=document.getElementById("legend"); legend.innerHTML="";
  if(!entries.length){ legend.innerHTML='<div class="empty">這段期間還沒有紀錄</div>'; }
  entries.forEach(([shop,amt])=>{
    const row=document.createElement("div"); row.className="legend-row";
    const pct=total?((amt/total)*100).toFixed(1):0;
    row.innerHTML=`<div class="legend-sw" style="background:${shopColors[shop]}"></div>
      <div class="legend-nm">${esc(shop)}</div><div class="legend-vl">${fmt(amt)} (${pct}%)</div>`;
    legend.appendChild(row);
  });
  const n=filtered.length;
  const avgP=n?Math.round(total/n):0;
  const avgS=n?(filtered.reduce((s,r)=>s+(r.stars||0),0)/n).toFixed(1):0;
  const topShop=entries.length?entries[0][0]:"—";
  const sc={},ic={};
  filtered.forEach(r=>{ sc[r.sugar]=(sc[r.sugar]||0)+1; ic[r.ice]=(ic[r.ice]||0)+1; });
  const fs=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];
  const fi=Object.entries(ic).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById("statSummary").innerHTML=`
    <div class="stat-box"><div class="k">總消費</div><div class="v">${fmt(total)}</div></div>
    <div class="stat-box"><div class="k">杯數</div><div class="v">${n} 杯</div></div>
    <div class="stat-box"><div class="k">平均單價</div><div class="v">${fmt(avgP)}</div></div>
    <div class="stat-box"><div class="k">平均評價</div><div class="v">${avgS} ★</div></div>
    <div class="stat-box"><div class="k">最常光顧</div><div class="v">${esc(topShop)}</div></div>
    <div class="stat-box"><div class="k">偏好甜度</div><div class="v">${fs?fs[0]:"—"}</div></div>
    <div class="stat-box"><div class="k">偏好冰塊</div><div class="v">${fi?fi[0]:"—"}</div></div>`;
}

function drawPie(entries,total){
  const canvas=document.getElementById("pieChart");
  const dpr=window.devicePixelRatio||1;
  const w=canvas.parentElement.clientWidth||260;
  const size=Math.min(w-24,220);
  canvas.style.width=size+"px"; canvas.style.height=size+"px";
  canvas.width=size*dpr; canvas.height=size*dpr;
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  const cx=size/2,cy=size/2,r=size/2-8;
  ctx.clearRect(0,0,size,size);
  if(!total||!entries.length){
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle="#F5EBC8";ctx.fill();
    ctx.fillStyle="#B5A074";ctx.font="12px sans-serif";ctx.textAlign="center";ctx.fillText("尚無資料",cx,cy+4);
    return;
  }
  let start=-Math.PI/2;
  entries.forEach(([shop,amt])=>{
    const slice=(amt/total)*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,start+slice);ctx.closePath();
    ctx.fillStyle=shopColors[shop];ctx.fill();
    start+=slice;
  });
  ctx.beginPath();ctx.arc(cx,cy,r*.52,0,Math.PI*2);ctx.fillStyle="#FFFDF5";ctx.fill();
  ctx.fillStyle="#6B4226";ctx.font="bold 14px sans-serif";ctx.textAlign="center";ctx.fillText(fmt(total),cx,cy+5);
}

initCal(); initStats(); refreshChips(); renderList(); renderCalendar(); renderStats();
</script>
